<style>

  :root {

    --chip-bg: rgba(255, 255, 255, 0.9);
    --chip-border: rgba(128, 128, 128, 0.4);
    --input-bg: rgba(255, 255, 255, 0.8);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ac: #bdbdbd;
      --ac-light: #d6d6d6;
      --ac-dark: #9e9e9e;
      --ac-text: #e0e0e0;
      --btn-text: #111111;
      --bad: #f87171;
      --bg-gradient: #1a1a1a;
      --card-bg: rgba(15, 23, 42, 0.75);

  body {

    color: var(--text-main);

    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

    border-color: var(--ac);
    box-shadow: 0 6px 16px rgba(128, 128, 128, 0.2);

  }

  .custom-input:focus {
    border-color: var(--ac-light);
    box-shadow: 0 0 0 4px rgba(128, 128, 128, 0.15);
    outline: none;
  }

  .btn-primary {

    box-shadow: 0 4px 14px rgba(80, 80, 80, 0.3);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

    box-shadow: 0 6px 20px rgba(80, 80, 80, 0.4);
  }

  .btn-primary:active:not(:disabled) {

  }

  }

  .prog-dot.c {
    background: var(--ac);
    box-shadow: 0 0 8px rgba(128, 128, 128, 0.5);

  .ac-text { color: var(--ac-text) !important; }

  .ac-hover:hover { color: var(--ac-text) !important; }
  .tx { color: var(--text-main) !important; }
  .btn-primary { color: var(--btn-text) !important; white-space: nowrap; }

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function getCho(str){
  let res = "";
  for(let i=0;i<str.length;i++){
    const code = str.charCodeAt(i)-44032;
    if(code>=0 && code<=11172){
      res += CHO[Math.floor(code/588)];
    } else {
      res += str[i];
    }
  }
  return res;
}

function clean(str){
  return str.replace(/[^가-힣a-zA-Z0-9]/g,"").toLowerCase();
}

function seededShuffle(arr, seed){
  const a = arr.slice();
  let m = a.length, t, i;
  let s = seed;
  while(m){
    s = (s * 9301 + 49297) % 233280;
    i = Math.floor((s / 233280) * m--);
    t = a[m]; a[m] = a[i]; a[i] = t;
  }
  return a;
}

function getTodaySeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}

});

  const cat = catEl.value;
  const mode = document.getElementById("mode").value;
  let pool = DATA.filter(x => cat === "전체" || x.s === cat);
  
  if(pool.length === 0){
    alert("해당 분야에 문제가 없습니다.");
    return;
  }
  
  if(mode === "daily"){
    pool = seededShuffle(pool, getTodaySeed());
  } else {
    pool = seededShuffle(pool, Math.floor(Math.random()*1000000));
  }
  
  currentList = pool.slice(0, Math.min(20, pool.length));
  idx = 0;
  results = new Array(currentList.length).fill(null);
  hintLevel = 0;
  renderQuestion();
}

      <!-- Meta Info -->
      <div class="meta flex justify-between items-center text-xs font-semibold text-slate-500 dark:text-slate-400 mb-4">
        <span><i class="fa-solid fa-layer-group ac-text"></i> ${q.s}</span>
        <span class="ac-bg10 ac-text px-2.5 py-0.5 rounded-full">
          문제 ${idx + 1} / ${total}
        </span>
      </div>

      <!-- 3D Glasslike Chosung Chips Display -->
      <div class="cho flex justify-center gap-2 sm:gap-3 my-6 flex-wrap">
        ${chosung.split('').map(char => `
          <div class="chosung-chip w-12 h-14 sm:w-14 sm:h-16 rounded-xl flex items-center justify-center font-black text-2xl sm:text-3xl ac-text">
            ${char}
          </div>
        `).join('')}
      </div>

      <!-- Description Box -->
      <div class="bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200/50 dark:border-slate-700/50 rounded-xl p-4 text-sm tx leading-relaxed mb-6">
        <span class="font-semibold ac-text"><i class="fa-solid fa-quote-left mr-1"></i> 뜻풀이:</span> ${q.d}
      </div>

      <!-- Input Row -->
      <div class="row flex gap-2">
        <input type="text" id="ans" class="custom-input flex-1 px-4 py-3 rounded-xl text-base tx placeholder-slate-400" placeholder="정답을 입력하세요" autofocus autocomplete="off">
        <button id="sub" class="btn-primary font-bold px-6 py-3 rounded-xl flex items-center gap-1.5">
          <i class="fa-solid fa-paper-plane"></i> 제출
        </button>
      </div>

      <!-- Hint Section -->
      ${hintText ? `<div class="hint mt-4 text-xs sm:text-sm text-slate-600 dark:text-slate-300 ac-bg5 border-l-4 ac-bl p-3 rounded-r-lg space-y-1">${hintText}</div>` : ''}

      <!-- Message Area -->
      <div id="msg" class="msg min-h-[1.6em] mt-3 text-sm font-semibold text-center"></div>

      <!-- Action Buttons -->
      <div class="acts flex gap-2 mt-6 flex-wrap">
        <button id="btnHint" class="btn-secondary text-xs sm:text-sm font-medium px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 flex-1">
          <i class="fa-regular fa-lightbulb text-amber-500"></i> 힌트 보기 (${hintLevel}/3)
        </button>
        <button id="btnSkip" class="btn-secondary text-xs sm:text-sm font-medium px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 flex-1">
          <i class="fa-solid fa-forward"></i> 건너뛰기
        </button>
      </div>

    </div>
  `;

  document.getElementById("ans").focus();
  document.getElementById("ans").addEventListener("keypress", function(e){
    if(e.key === "Enter") checkAnswer();
  });
  document.getElementById("sub").addEventListener("click", checkAnswer);
  document.getElementById("btnHint").addEventListener("click", function(){
    if(hintLevel < 3){
      hintLevel++;
      renderQuestion();
    }
  });
  document.getElementById("btnSkip").addEventListener("click", function(){
    results[idx] = false;
    const msg = document.getElementById("msg");
    msg.className = "msg ng text-red-500 dark:text-red-400 mt-3 text-sm font-semibold text-center";
    msg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 정답은 <b>"${q.a}"</b> (원문: ${q.n}) 입니다.`;
    disableInputs();
    setTimeout(() => {
      idx++;
      hintLevel = 0;
      renderQuestion();
    }, 1800);
  });
}

function disableInputs(){
  const input = document.getElementById("ans");
  const sub = document.getElementById("sub");
  const hint = document.getElementById("btnHint");
  const skip = document.getElementById("btnSkip");
  if(input) input.disabled = true;
  if(sub) sub.disabled = true;
  if(hint) hint.disabled = true;
  if(skip) skip.disabled = true;
}

function checkAnswer(){
  const input = document.getElementById("ans");
  if(!input || input.disabled) return;
  const user = clean(input.value);
  if(!user) return;
  
  const q = currentList[idx];
  const targetA = clean(q.a);
  const targetN = clean(q.n);
  const aliasList = (q.x || []).map(clean);
  
  const isCorrect = (user === targetA || user === targetN || aliasList.includes(user));
  const msg = document.getElementById("msg");

  if(isCorrect){
    results[idx] = true;
    msg.className = "msg ok ac-text mt-3 text-sm font-bold text-center";
    msg.innerHTML = `<i class="fa-solid fa-circle-check"></i> 정답입니다! 🎉 (정답: ${q.n})`;
    disableInputs();
    setTimeout(() => {
      idx++;
      hintLevel = 0;
      renderQuestion();
    }, 1200);
  } else {
    msg.className = "msg ng text-red-500 dark:text-red-400 mt-3 text-sm font-semibold text-center";
    msg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 오답입니다. 다시 시도해보세요!`;
    input.select();
  }
}

function renderResult(){
  const g = document.getElementById("game");
  const correctCount = results.filter(x => x === true).length;
  const total = results.length;
  const score = Math.round((correctCount / total) * 100);

  g.innerHTML = `
    <div class="glass-card rounded-2xl p-6 text-center space-y-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full ac-bg10 ac-text text-3xl my-2">
        <i class="fa-solid fa-trophy"></i>
      </div>
      
      <div>
        <h2 class="text-2xl font-bold tx">퀴즈 완료!</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">총 ${total}문항 중 <b class="ac-text">${correctCount}문항</b> 맞히셨습니다.</p>
        <div class="text-3xl font-black ac-text mt-3">${score}점</div>
      </div>

      <div class="res text-left bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200/50 dark:border-slate-700/50 rounded-xl p-4 max-h-80 overflow-y-auto space-y-2">
        <h3 class="text-sm font-bold tx mb-3 border-b border-slate-200 dark:border-slate-700 pb-2 flex items-center justify-between">
          <span>문제 결과 복습</span>
          <span class="text-xs font-normal text-slate-400">정답 여부</span>
        </h3>
        <ul class="space-y-2 text-xs sm:text-sm">
          ${currentList.map((q, i) => `
            <li class="flex justify-between items-start gap-2 p-2 rounded-lg ${results[i] ? 'ac-bg5' : 'bg-red-500/5'}">
              <span class="tx">
                <b>${i+1}.</b> ${q.n} <span class="text-slate-400 text-xs">(${getCho(q.a)})</span>
              </span>
              <span class="${results[i] ? 'ac-text' : 'text-red-500'} font-bold flex-shrink-0">
                ${results[i] ? '<i class="fa-solid fa-check"></i> 정답' : '<i class="fa-solid fa-xmark"></i> 오답'}
              </span>
            </li>
          `).join('')}
        </ul>
      </div>

      <button id="retry" class="btn-primary font-bold px-8 py-3 rounded-xl text-sm w-full sm:w-auto inline-flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> 다시 도전하기
      </button>
    </div>
  `;

  document.getElementById("retry").addEventListener("click", initGame);
}

document.getElementById("start").addEventListener("click", initGame);
catEl.addEventListener("change", initGame);
document.getElementById("mode").value = "rand";

// Start Quiz on Load
initGame();
</script>
</body>
</html>
