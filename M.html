<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#181818;--bg3:#222;--bg4:#2a2a2a;
  --accent:#1db954;--accent2:#1aa34a;
  --text:#fff;--text2:#b3b3b3;--text3:#555;
  --border:#2a2a2a;
}
html,body{height:100%;background:var(--bg);font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:var(--text);overflow:hidden}
.pw{display:flex;height:100vh}
.sidebar{width:300px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sb-head{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sb-row{display:flex;gap:6px}
input[type=text]{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 10px;font-size:12px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:var(--accent)}
.add-btn{flex:1;background:var(--accent);border:none;border-radius:5px;color:#fff;padding:6px 12px;font-size:11px;cursor:pointer;font-weight:bold;white-space:nowrap}
.add-btn:hover{background:var(--accent2)}
.sort-bar{display:flex;gap:4px}
.clr-btn{flex-shrink:0;width:34px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background 0.15s,color 0.15s,border-color 0.15s;white-space:nowrap}
.clr-btn:hover:not(:disabled){color:#ff5555;border-color:#ff5555}
.clr-btn:disabled{opacity:.35;cursor:default}
.clr-btn.arm,.clr-btn.arm:hover:not(:disabled){width:auto;padding:0 10px;background:#c62828;border-color:#c62828;color:#fff;font-size:11px;font-weight:bold}
.sb{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text3);padding:4px 0;font-size:10px;cursor:pointer;text-align:center;font-family:inherit;transition:all 0.15s}
.sb:hover{color:var(--text)}
.sb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tlist{flex:1;overflow-y:auto}
.tlist::-webkit-scrollbar{width:4px}
.tlist::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.ti{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 4px;cursor:pointer;border-bottom:1px solid #1a1a1a;transition:background 0.1s;position:relative;user-select:none}
.ti:hover{background:var(--bg3)}
.ti.on{background:var(--bg4)}
.ti.on .tn{color:var(--accent)}
.ti.dragging{opacity:0.3}
.ti.drag-over-top{box-shadow:inset 0 2px 0 var(--accent)}
.ti.drag-over-bot{box-shadow:inset 0 -2px 0 var(--accent)}
.drag-handle{cursor:grab;color:#444;font-size:13px;padding:2px 5px;flex-shrink:0;opacity:0;transition:opacity 0.15s;line-height:1}
.drag-handle:active{cursor:grabbing}
.ti:hover .drag-handle{opacity:1}
.del-btn{flex-shrink:0;background:none;border:none;color:#444;font-size:13px;cursor:pointer;padding:2px 4px;border-radius:3px;opacity:0;transition:opacity 0.15s,color 0.15s;line-height:1;margin-left:2px}
.ti:hover .del-btn{opacity:1}
.del-btn:hover{color:#ff5555}
.ti-art{width:36px;height:36px;border-radius:4px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:17px}
.ti-art img{width:100%;height:100%;object-fit:cover}
.tnum{font-size:10px;color:var(--text3);min-width:16px;text-align:right;flex-shrink:0}
.ti.on .tnum{display:none}
.tpic{display:none;font-size:9px;color:var(--accent);min-width:16px;text-align:center;flex-shrink:0}
.ti.on .tpic{display:block}
.tinfo{flex:1;min-width:0}
.tn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tdur{font-size:10px;color:var(--text3);flex-shrink:0}
.dz{border:1.5px dashed var(--border);border-radius:8px;margin:14px;padding:28px 14px;text-align:center;cursor:pointer}
.dz:hover,.dz.ov{border-color:var(--accent)}
.dz strong{color:var(--accent);display:block;font-size:13px;margin-bottom:8px}
.dz p{font-size:11px;color:var(--text3);line-height:2}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 40px;gap:24px;overflow:hidden}
.stage{position:relative;width:220px;height:220px;flex-shrink:0}
.art-wrap{width:100%;height:100%;border-radius:12px;background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 8px 32px rgba(0,0,0,0.5);position:relative;cursor:pointer}
.art-wrap img{width:100%;height:100%;object-fit:cover}
.lrc-badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:var(--accent);font-size:10px;padding:2px 7px;border-radius:10px;display:none;align-items:center;justify-content:center;letter-spacing:.5px}
.lyrics-panel{position:absolute;inset:0;background:var(--bg3);border-radius:12px;display:none;flex-direction:column;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.5);cursor:pointer;padding:16px 12px}
.stage.lyrics-on .art-wrap{display:none}
.stage.lyrics-on .lyrics-panel{display:flex}
.lyr-close{position:sticky;top:0;align-self:flex-end;flex-shrink:0;z-index:2;background:rgba(0,0,0,.55);color:var(--text);border:none;border-radius:20px;padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px}
.lyr-close:hover{background:rgba(0,0,0,.8)}

<body>

<script>
const aud = new Audio();
let tracks = [], cur = -1, shuf = false, rep = false;
let sk = 'title', sd = 1;
let dragSrcIdx = null;
let lastActiveLine = -1;

const fmt = s => { if(isNaN(s)||s<0)return'0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; };
let DOC = document;   // 미니 플레이어(PiP 창)로 옮겨가면 그 창의 document를 가리킴
const $ = id => DOC.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const stat = m => $('sbar').textContent = m;

// ── 라이브러리 로컬 저장(IndexedDB) — 종료 후 다시 열어도 목록 유지 ──
const DB_NAME = 'musicPlayerDB', DB_VERSION = 1, DB_STORE = 'library';
let _dbPromise = null;
function openLibraryDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => { req.result.createObjectStore(DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
  return _dbPromise;
}

let _saveTimer = null;
function scheduleSave(){
  if(miniActive) return;   // 팝업이 재생을 넘겨받은 동안 원래 창은 저장하지 않음(팝업 변경분 덮어쓰기 방지)
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveLibrary, 400);
}

async function saveLibrary(){
  if(miniActive) return;
  try{
    const db = await openLibraryDB();
    const data = {
      cur, shuf, rep,
      tracks: tracks.map(t => ({
        file: t.file, name: t.name, artist: t.artist, title: t.title,
        album: t.album, year: t.year, track: t.track, albumart: t.albumart,
        lrcKey: t.lrcKey, lyrics: t.lyrics, lyricsSrc: t.lyricsSrc,
        lyricsSynced: t.lyricsSynced, dur: t.dur
      }))
    };
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(data, 'state');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.warn('라이브러리 저장 실패(재생에는 지장 없음):', e); }
}

async function restoreLibrary(){
  try{
    const db = await openLibraryDB();
    const data = await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const rq = tx.objectStore(DB_STORE).get('state');
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror   = () => reject(rq.error);
    });
    tracks.forEach(t => { try{ URL.revokeObjectURL(t.url); }catch(e){} });
    if(!data || !data.tracks || !data.tracks.length){
      tracks = []; cur = -1; aud.removeAttribute('src'); resetMain(); render(); return;
    }
    tracks = data.tracks.map(t => ({ ...t, url: URL.createObjectURL(t.file) }));
    cur  = typeof data.cur === 'number' ? data.cur : -1;
    shuf = !!data.shuf; rep = !!data.rep;
    $('shuf').classList.toggle('abtn', shuf);
    $('rep').classList.toggle('abtn', rep);
    render();
    if(cur >= 0 && tracks[cur]){
      aud.src = tracks[cur].url;
      aud.volume = $('vs').value/100;
      updateMain();
    }
    stat(tracks.length+'곡 불러옴 (이전 목록 복원)');
  }catch(e){ console.warn('라이브러리 복원 실패:', e); }
}

// ── jsmediatags로 태그 읽기 (서버 불필요) ──────────────────────────
function loadTags(i) {
  const t = tracks[i];
  // OPUS·OGG는 jsmediatags가 못 읽으므로 직접 파싱(제목·가수·앨범·앨범 사진·가사)
  if(OGG_RE.test(t.file.name)){
    readOggTags(t.file).then(c => {
      if(!c) return;
      applyOggTags(t, c);
      render();
      if(tracks[cur] === t) updateMain();
      scheduleSave();
    }).catch(e => console.warn('OGG 태그 읽기 실패:', e));
    return;
  }
  jsmediatags.read(t.file, {
    onSuccess: function(tag) {
      const tags = tag.tags;
      if(tags.title)  t.title  = tags.title;
      if(tags.artist) t.artist = tags.artist;
      if(tags.album)  t.album  = tags.album;
      if(tags.year)   t.year   = tags.year;
      if(tags.track)  t.track  = String(tags.track);
      if(tags.picture) {
        const pic = tags.picture;
        const mime = pic.format || 'image/jpeg';
        const b64 = btoa(pic.data.reduce((s,b)=>s+String.fromCharCode(b),''));
        t.albumart = `data:${mime};base64,${b64}`;
      }
      // 폴더의 .lrc가 없을 때 파일 내장 가사 태그로 보충 (MP3 USLT / M4A ©lyr)
      if(tags.lyrics && !t.lyrics){
        const lyricText = typeof tags.lyrics === 'string' ? tags.lyrics : (tags.lyrics.lyrics || '');
        if(lyricText) setLyrics(t, lyricText, 'tag');
      }
      render();
      if(i === cur) updateMain();
      scheduleSave();
    },
    onError: function(e) {
      // 태그 없는 파일은 파일명으로 동작
    }
  });
  // jsmediatags는 FLAC의 Vorbis Comment 가사 필드를 읽지 못해 직접 파싱
  if(!t.lyrics && /\.flac$/i.test(t.file.name)){
    readFlacLyrics(t.file).then(text => {
      if(text && !t.lyrics){
        setLyrics(t, text, 'tag');
        render();
        if(i === cur) updateMain();
        scheduleSave();
      }
    }).catch(()=>{});
  }
}

// ── OPUS·OGG(Vorbis) 태그 직접 파싱 ─────────────────────────────
// Ogg 페이지를 순서대로 읽어 두 번째 패킷(OpusTags / Vorbis comment 헤더)만 꺼낸다.
// 앨범 사진이 크면 여러 페이지에 걸쳐 있으므로 패킷이 끝날 때까지 이어 붙인다.
const OGG_RE = /\.(opus|ogg|oga)$/i;
function concatU8(parts){
  const len = parts.reduce((a,p)=>a+p.length,0), out = new Uint8Array(len);
  let o = 0; for(const p of parts){ out.set(p,o); o += p.length; }
  return out;
}
async function readOggTags(file){
  const LIMIT = Math.min(file.size, 64*1024*1024);
  let off = 0, serial = null, part = [], packets = [], pages = 0;
  while(off + 27 <= LIMIT && packets.length < 2 && pages < 5000){
    const hdr = new Uint8Array(await file.slice(off, off+27).arrayBuffer());
    if(hdr[0]!==0x4f || hdr[1]!==0x67 || hdr[2]!==0x67 || hdr[3]!==0x53) return null;   // 'OggS'
    const nseg = hdr[26];
    const segs = new Uint8Array(await file.slice(off+27, off+27+nseg).arrayBuffer());
    const bodyLen = segs.reduce((a,b)=>a+b,0), bodyStart = off+27+nseg;
    const pageSerial = (hdr[14] | hdr[15]<<8 | hdr[16]<<16 | hdr[17]<<24) >>> 0;
    if(serial === null) serial = pageSerial;
    if(pageSerial === serial){
      const body = new Uint8Array(await file.slice(bodyStart, bodyStart+bodyLen).arrayBuffer());
      let p = 0;
      for(const sz of segs){
        part.push(body.subarray(p, p+sz)); p += sz;
        if(sz < 255){ packets.push(concatU8(part)); part = []; if(packets.length >= 2) break; }
      }
    }
    off = bodyStart + bodyLen; pages++;
  }
  if(packets.length < 2) return null;
  const pk = packets[1];
  const head = String.fromCharCode.apply(null, pk.subarray(0, 8));
  let skip;
  if(head === 'OpusTags') skip = 8;                                  // Opus
  else if(pk[0] === 3 && head.slice(1,7) === 'vorbis') skip = 7;      // Ogg Vorbis
  else return null;
  return parseVorbisComment(pk.buffer.slice(pk.byteOffset + skip, pk.byteOffset + pk.byteLength));
}
function u8ToB64(u){
  let s = '';
  for(let i=0; i<u.length; i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(s);
}
// METADATA_BLOCK_PICTURE(base64, FLAC 그림 블록 구조) → {mime, data}
function oggPicture(b64){
  try{
    const bin = atob(String(b64).split('\n')[0].trim());
    const u = new Uint8Array(bin.length);
    for(let i=0; i<bin.length; i++) u[i] = bin.charCodeAt(i);
    const dv = new DataView(u.buffer);
    let p = 4;                                             // 그림 종류
    const ml = dv.getUint32(p); p += 4;
    const mime = new TextDecoder().decode(u.subarray(p, p+ml)); p += ml;
    const dl = dv.getUint32(p); p += 4 + dl;               // 설명
    p += 16;                                               // 폭·높이·색 깊이·색수
    const len = dv.getUint32(p); p += 4;
    const data = u.subarray(p, p+len);
    return data.length ? { mime: mime || 'image/jpeg', data } : null;
  }catch(e){ return null; }
}
function applyOggTags(t, c){
  const one = k => c[k] ? String(c[k]).split('\n')[0].trim() : '';
  if(one('TITLE'))  t.title  = one('TITLE');
  if(c.ARTIST)      t.artist = String(c.ARTIST).split('\n').map(s=>s.trim()).filter(Boolean).join(', ');
  if(one('ALBUM'))  t.album  = one('ALBUM');
  const d = one('DATE') || one('YEAR'); if(d) t.year = d.slice(0,4);
  if(one('TRACKNUMBER')) t.track = one('TRACKNUMBER');
  const pic = c.METADATA_BLOCK_PICTURE ? oggPicture(c.METADATA_BLOCK_PICTURE) : null;
  if(pic) t.albumart = `data:${pic.mime};base64,${u8ToB64(pic.data)}`;
  else if(c.COVERART) t.albumart = `data:${one('COVERARTMIME') || 'image/jpeg'};base64,${one('COVERART')}`;
  const lk = Object.keys(c).find(k => /^(LYRICS|UNSYNCEDLYRICS|SYNCEDLYRICS|LYRIC)$/i.test(k));
  if(lk && !t.lyrics) setLyrics(t, c[lk], 'tag');
}

// ── LRC 가사 지원 ────────────────────────────────────────────────
const AUDIO_RE = /\.(mp3|flac|wav|ogg|oga|opus|m4a|aac|wma)$/i;
const LRC_RE = /\.lrc$/i;

// 파일/폴더 선택·드롭 결과를 {file, rel}(상대경로 포함) 배열로 통일
function toEntries(fileList){
  return Array.from(fileList).map(f => ({ file: f, rel: (f.webkitRelativePath || f.name) }));
}

// 드래그&드롭으로 폴더째 들어온 경우 재귀적으로 내부 파일까지 수집
async function collectDropEntries(dt){
  const items = dt.items;
  if(items && items.length && items[0].webkitGetAsEntry){
    const roots = Array.from(items).map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
    if(!roots.length) return toEntries(dt.files);
    const out = [];
    const readDir = entry => new Promise((res,rej)=>{
      const reader = entry.createReader();
      let all = [];
      (function next(){
        reader.readEntries(batch=>{
          if(!batch.length){ res(all); return; }
          all = all.concat(batch); next();
        }, rej);
      })();
    });
    async function walk(entry, path){
      if(entry.isFile){
        const f = await new Promise((res,rej)=>entry.file(res, rej));
        out.push({ file: f, rel: path + f.name });
      } else if(entry.isDirectory){
        const children = await readDir(entry);
        for(const c of children) await walk(c, path + entry.name + '/');
      }
    }
    for(const r of roots) await walk(r, '');
    return out;
  }
  return toEntries(dt.files);
}

// 폴더/파일명 기준 매칭 키 (같은 폴더 + 같은 이름이면 매칭)
function keyOf(rel){
  const parts = String(rel).replace(/\\/g,'/').split('/');
  const fname = parts.pop();
  const dir = parts.join('/').toLowerCase();
  const base = fname.replace(/\.[^.]+$/,'').toLowerCase().trim();
  return dir + '|' + base;
}

// EUC-KR로 저장된 .lrc도 최대한 읽어내기
function decodeText(buf){
  let s = new TextDecoder('utf-8').decode(buf);
  if(s.indexOf('�') !== -1){
    try{ const alt = new TextDecoder('euc-kr').decode(buf); if(alt.indexOf('�') === -1) s = alt; }catch(e){}
  }
  return s;
}

function parseLRC(text){
  const lines = text.split(/\r\n|\n|\r/);
  const timeTag = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  const out = [];
  for(const raw of lines){
    timeTag.lastIndex = 0;
    let m, times = [];
    while((m = timeTag.exec(raw))){
      const min = parseInt(m[1],10);
      const sec = parseFloat(m[2] + (m[3] ? '.'+m[3] : ''));
      times.push(min*60+sec);
    }
    if(!times.length) continue;
    const text2 = raw.replace(timeTag,'').trim();
    times.forEach(t => out.push({ time: t, text: text2 }));
  }
  out.sort((a,b)=>a.time-b.time);
  return out;
}

// 시간 태그가 있으면 동기화 가사로, 없으면(순수 텍스트) 비동기화 가사로 저장
// src: 'lrc'(같은 폴더 .lrc 파일) | 'tag'(파일 내장 가사 태그)
function setLyrics(t, text, src){
  const synced = parseLRC(text);
  if(synced.length){ t.lyrics = synced; t.lyricsSrc = src; t.lyricsSynced = true; return; }
  const plain = text.split(/\r\n|\n|\r/).map(s=>s.trim()).filter(Boolean);
  if(plain.length){ t.lyrics = plain.map(s=>({time:-1,text:s})); t.lyricsSrc = src; t.lyricsSynced = false; }
}

// src가 'tag'일 때만 사용: 이미 가사가 있으면(주로 폴더 .lrc) 덮어쓰지 않음
function fallbackLyrics(t, text, src){ if(!t.lyrics) setLyrics(t, text, src); }

// ── FLAC 내장 가사 (Vorbis Comment) ────────────────────────────────
// jsmediatags 번들의 FLAC 리더는 title/artist/album/track/genre/picture만 읽고
// LYRICS 필드는 버리므로, 필요한 블록만 직접 슬라이스해서 파싱한다.
async function readFlacLyrics(file){
  const head = new Uint8Array(await file.slice(0,4).arrayBuffer());
  if(String.fromCharCode(head[0],head[1],head[2],head[3]) !== 'fLaC') return null;
  let offset = 4;
  const size = file.size;
  while(offset + 4 <= size){
    const hb = new Uint8Array(await file.slice(offset, offset+4).arrayBuffer());
    const isLast = (hb[0] & 0x80) !== 0;
    const blockType = hb[0] & 0x7f;
    const blockLen = (hb[1]<<16) | (hb[2]<<8) | hb[3];
    offset += 4;
    if(blockLen < 0 || offset+blockLen > size) break; // 안전장치
    if(blockType === 4){ // VORBIS_COMMENT
      const comments = parseVorbisComment(await file.slice(offset, offset+blockLen).arrayBuffer());
      const key = Object.keys(comments).find(k => /^(LYRICS|UNSYNCEDLYRICS|SYNCEDLYRICS|LYRIC)$/i.test(k));
      return key ? comments[key] : null;
    }
    offset += blockLen;
    if(isLast) break;
  }
  return null;
}

function parseVorbisComment(buf){
  const dv = new DataView(buf);
  let p = 0;
  const readLen = () => { const v = dv.getUint32(p, true); p += 4; return v; };
  if(buf.byteLength < 8) return {};
  const vendorLen = readLen();
  p += vendorLen; // vendor 문자열 길이만큼 건너뜀
  const count = readLen();
  const comments = {};
  for(let i=0; i<count && p+4<=buf.byteLength; i++){
    const len = readLen();
    if(p+len > buf.byteLength) break;
    const str = new TextDecoder('utf-8').decode(new Uint8Array(buf, p, len));
    p += len;
    const eq = str.indexOf('=');
    if(eq>0){
      const key = str.slice(0,eq).toUpperCase();
      const val = str.slice(eq+1);
      comments[key] = comments[key] ? comments[key]+'\n'+val : val;
    }
  }
  return comments;
}

// ── 파일 추가 (일반 선택 / 폴더 선택 / 드래그드롭 공용) ────────────
function addF(files){ ingest(toEntries(files)); }

async function ingest(entries){
  if(!entries.length || miniActive) return;
  const audioEntries = entries.filter(e => AUDIO_RE.test(e.file.name) || e.file.type.startsWith('audio/'));
  const lrcEntries   = entries.filter(e => LRC_RE.test(e.file.name));

  const lrcTextMap = {};
  for(const e of lrcEntries){
    try{ lrcTextMap[keyOf(e.rel)] = decodeText(await e.file.arrayBuffer()); }
    catch(err){ /* 읽기 실패한 lrc는 무시 */ }
  }

  const prevLen = tracks.length;
  audioEntries.forEach(e => {
    const f = e.file;
    const name = f.name.replace(/\.[^.]+$/,'');
    const parts = name.split(' - ');
    const k = keyOf(e.rel);
    const t = {
      url: URL.createObjectURL(f), name, file: f, dur: 0,
      artist: parts.length>1 ? parts[0].trim() : '',
      title:  parts.length>1 ? parts.slice(1).join(' - ').trim() : name,
      album:'', year:'', track:'', albumart:null,
      lrcKey: k, lyrics: null, lyricsSrc: null, lyricsSynced: false
    };
    if(lrcTextMap[k]) setLyrics(t, lrcTextMap[k], 'lrc');
    tracks.push(t);
  });

  // 이미 있던 곡도 이번에 새로 들어온 .lrc와 이름이 맞으면 연결(폴더 .lrc가 태그 가사보다 우선)
  if(lrcEntries.length){
    tracks.forEach(t => { if(lrcTextMap[t.lrcKey]) setLyrics(t, lrcTextMap[t.lrcKey], 'lrc'); });
  }

  if(tracks.length === prevLen && !lrcEntries.length) return;
  if(cur === -1 && tracks.length > prevLen){ cur = prevLen; loadAudio(cur, true); }
  render();
  if(cur >= 0) updateMain();
  const withLyrics = tracks.filter(t => t.lyrics && t.lyrics.length).length;
  stat(tracks.length+'곡'+(withLyrics ? ' · 가사 '+withLyrics+'곡 인식' : ''));
  for(let i=prevLen; i<tracks.length; i++) loadTags(i);
  scheduleSave();
}

function sort(k) {
  if(sk===k) sd*=-1; else{sk=k;sd=1;}
  DOC.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));
  const btn=$('s-'+k); if(btn)btn.classList.add('on');
  const ct = cur>=0 ? tracks[cur] : null;
  tracks.sort((a,b)=>{
    const av = k==='title'?(a.title||a.name):k==='artist'?a.artist:a.name;
    const bv = k==='title'?(b.title||b.name):k==='artist'?b.artist:b.name;
    return(av||''). localeCompare(bv||'','ko')*sd;
  });
  if(ct) cur = tracks.indexOf(ct);
  render();
  scheduleSave();
}

let _clrTimer = null;
function updateClrBtn(){
  const b = $('clrAll'); if(!b) return;
  b.disabled = !tracks.length;
  if(!tracks.length) disarmClr();
}
function disarmClr(){
  clearTimeout(_clrTimer); _clrTimer = null;
  const b = $('clrAll'); if(!b) return;
  b.classList.remove('arm'); b.textContent = '🗑'; b.title = '목록 전체 삭제';
}
function clearAll(){
  if(!tracks.length) return;
  const b = $('clrAll');
  if(!b.classList.contains('arm')){
    b.classList.add('arm'); b.textContent = '전체 삭제?'; b.title = '한 번 더 누르면 '+tracks.length+'곡 모두 삭제';
    _clrTimer = setTimeout(disarmClr, 3000);

  }

  tracks = []; cur = -1;

// ── 삭제 ─────────────────────────────────────────────────────────
function delTrack(e, i) {
  e.stopPropagation();
  const wasPlaying = !aud.paused;
  if(i === cur){
    aud.pause();
    try{ URL.revokeObjectURL(tracks[i].url); }catch(err){}
    tracks.splice(i, 1);
    if(!tracks.length){ cur=-1; resetMain(); render(); stat('0곡'); scheduleSave(); return; }
    cur = Math.min(i, tracks.length-1);
    loadAudio(cur, wasPlaying);
  } else {
    try{ URL.revokeObjectURL(tracks[i].url); }catch(err){}
    tracks.splice(i, 1);
    if(i < cur) cur--;
  }
  render();
  stat(tracks.length+'곡');
  scheduleSave();
}

function resetMain(){
  $('ntitle').textContent='재생 중인 곡 없음';
  $('nartist').textContent='음악 파일을 추가해 주세요';
  $('nalbum').textContent='';
  $('aart').innerHTML='🎵';
  $('ct').textContent='0:00'; $('dt').textContent='0:00';

  $('stage').classList.remove('lyrics-on');
  lastActiveLine=-1;
}

// ── 드래그로 순서 변경 ────────────────────────────────────────────
function bindDragEvents(){
  $('tlist').querySelectorAll('.ti').forEach(el=>{
    el.addEventListener('dragstart',function(e){
      dragSrcIdx=parseInt(this.dataset.idx);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragover',function(e){
      e.preventDefault();
      if(parseInt(this.dataset.idx)===dragSrcIdx)return;
      const r=this.getBoundingClientRect(), mid=r.top+r.height/2;
      this.classList.remove('drag-over-top','drag-over-bot');
      this.classList.add(e.clientY<mid?'drag-over-top':'drag-over-bot');
    });
    el.addEventListener('dragleave',function(){ this.classList.remove('drag-over-top','drag-over-bot'); });
    el.addEventListener('drop',function(e){
      e.preventDefault();
      this.classList.remove('drag-over-top','drag-over-bot');
      const destIdx=parseInt(this.dataset.idx);
      if(dragSrcIdx===null||dragSrcIdx===destIdx)return;
      const r=this.getBoundingClientRect();
      const insertBefore=e.clientY<r.top+r.height/2;
      const ct=cur>=0?tracks[cur]:null;
      const [moved]=tracks.splice(dragSrcIdx,1);
      let dest=destIdx>dragSrcIdx?destIdx-1:destIdx;
      if(!insertBefore)dest++;
      tracks.splice(Math.max(0,Math.min(dest,tracks.length)),0,moved);
      if(ct)cur=tracks.indexOf(ct);
      render();
      scheduleSave();
    });
    el.addEventListener('dragend',function(){
      DOC.querySelectorAll('.ti').forEach(el2=>el2.classList.remove('dragging','drag-over-top','drag-over-bot'));
      dragSrcIdx=null;
    });
  });
}

// ── DZ 바인딩 ────────────────────────────────────────────────────
function bindDZ(){
  const dz=$('dz'); if(!dz)return;
  dz.onclick=()=>$('fi').click();

  dz.addEventListener('dragleave',()=>dz.classList.remove('ov'));

    ingest(await collectDropEntries(e.dataTransfer));
  });
}
function bindBodyDrop(body){
body.addEventListener('dragover',e=>e.preventDefault());
body.addEventListener('drop',async e=>{
  if(e.target.closest('#tlist')&&tracks.length)return;
  e.preventDefault();
  const entries = await collectDropEntries(e.dataTransfer);
  if(entries.length) ingest(entries);
});
}
bindBodyDrop(document.body);
bindDZ();

function toggleLyrics(){

  const on = $('stage').classList.toggle('lyrics-on');

function renderLyricsPanel(){
  const t = cur>=0 ? tracks[cur] : null;
  const lyr = t && t.lyrics;
  lastActiveLine=-1;
  if(!lyr || !lyr.length){
    $('lyricsInner').innerHTML = `<div class="lyr-empty">가사 없음<br><span style="opacity:.7">같은 폴더의 .lrc 파일 또는 파일에 내장된<br>가사 태그가 있으면 자동으로 표시됩니다</span></div>`;
    return;

  $('lyricsInner').innerHTML =

function seekLyric(i){
  const t = tracks[cur];
  if(!t || !t.lyrics || !t.lyrics[i]) return;
  aud.currentTime = t.lyrics[i].time;
}

function syncLyrics(c){
  if(!$('stage').classList.contains('lyrics-on')) return;
  const t = tracks[cur];
  if(!t || !t.lyricsSynced || !t.lyrics || !t.lyrics.length) return;
  let idx=-1;
  for(let i=0;i<t.lyrics.length;i++){ if(t.lyrics[i].time<=c) idx=i; else break; }
  if(idx===lastActiveLine) return;
  const inner = $('lyricsInner');
  const prev = inner.querySelector('.lline.active');
  if(prev) prev.classList.remove('active');
  if(idx>=0){
    const el = inner.querySelector(`.lline[data-i="${idx}"]`);
    if(el){ el.classList.add('active'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
  }
  lastActiveLine=idx;
}

function loadAudio(i, autoplay){
  if(i<0||i>=tracks.length)return;
  cur=i;
  aud.src=tracks[cur].url;
  aud.volume=$('vs').value/100;
  if(autoplay!==false) aud.play().catch(()=>{});
  updateMain(); render();
  stat('재생 중: '+(tracks[cur].title||tracks[cur].name));
  scheduleSave();
}

function load(i){ loadAudio(i,true); }

function togPlay(){

  aud.paused?aud.play().catch(()=>{}):aud.pause();
}

  w.document.title = '♪ 미니 플레이어';
  w.document.documentElement.classList.add('mini');
  // 인라인 onclick이 PiP 창 기준으로 실행되므로 함수 연결
  PIP_FUNCS.forEach(n => { try{ w[n] = window[n] || eval(n); }catch(e){} });
  // 플레이어 화면을 PiP 창으로 이동
  w.document.body.append($('pw'), $('sbar'));
  DOC = w.document;
  bindBodyDrop(w.document.body);
  $('miniBtn').textContent = '↩'; $('miniBtn').title = '원래 창으로 되돌리기';
  document.getElementById('miniOv').classList.add('on');
  w.addEventListener('pagehide', restoreFromPip, { once:true });
  const ti = $('tlist').querySelector('.ti.on'); if(ti) ti.scrollIntoView({ block:'nearest' });
}

function restoreFromPip(){
  if(!pipWin) return;
  const pw = DOC.getElementById('pw'), sb = DOC.getElementById('sbar');
  const ov = document.getElementById('miniOv');
  DOC = document;
  if(pw) document.body.insertBefore(pw, ov);
  if(sb) document.body.insertBefore(sb, ov);
  pipWin = null;
  $('miniBtn').textContent = '⧉'; $('miniBtn').title = '미니 플레이어로 열기';
  ov.classList.remove('on');
  render();
}

function closePip(){ if(pipWin){ const w = pipWin; restoreFromPip(); try{ w.close(); }catch(e){} } }

function seekWhenReady(t){
  if(!t) return;
  if(aud.readyState >= 1) aud.currentTime = t;
  else aud.addEventListener('loadedmetadata', () => { aud.currentTime = t; }, { once:true });
}

function openMini(){
  if(miniActive && miniWin && !miniWin.closed){ miniWin.focus(); return; }
  clearTimeout(_saveTimer);
  const url = location.href.split('#')[0] + '#mini';
  const w = window.open(url, 'musicMiniPlayer', 'popup=yes,width=490,height=910');
  if(!w){ stat('⚠ 팝업이 차단되었습니다 — 주소창의 팝업 차단 아이콘에서 허용해 주세요'); return; }
  miniWin = w;
  miniHandoff = { cur, time: aud.currentTime || 0, playing: !aud.paused, vol: +$('vs').value };
  miniSavePromise = saveLibrary();   // miniActive 설정 전에 최신 목록 저장
  miniActive = true;
  aud.pause();
  document.getElementById('miniOv').classList.add('on');
  stat('미니 플레이어로 넘겼습니다');
}

// 팝업이 돌려준 상태로 원래 창 복귀
async function exitMiniMode(m){
  if(!miniActive) return;
  miniActive = false; miniWin = null; miniHandoff = null;
  document.getElementById('miniOv').classList.remove('on');
  await restoreLibrary();
  if(m && m.vol != null){ $('vs').value = m.vol; aud.volume = m.vol/100; }
  if(m && typeof m.cur === 'number' && m.cur >= 0 && tracks[m.cur]){
    cur = m.cur;
    aud.src = tracks[cur].url; aud.volume = $('vs').value/100;
    updateMain(); render();
    seekWhenReady(m.time);
    if(m.playing) aud.play().catch(()=>{});
  }
  stat('원래 창으로 돌아왔습니다' + (tracks.length ? ' — '+tracks.length+'곡' : ''));
}

function recallMini(){
  if(pipWin){ closePip(); return; }
  if(miniWin && !miniWin.closed){
    try{ miniWin.postMessage({ app:MSG, type:'recall' }, '*'); }catch(e){}
    setTimeout(() => { if(miniActive) exitMiniMode(null); }, 2500);  // 응답 없을 때 대비
  } else exitMiniMode(null);
}

// 팝업 창: 넘겨받은 위치로 재생 시작
async function startMini(m){
  if(_miniStarted) return; _miniStarted = true;
  clearTimeout(_miniFallback);
  await restoreLibrary();
  if(!m) return;
  if(m.vol != null){ $('vs').value = m.vol; aud.volume = m.vol/100; }
  if(typeof m.cur === 'number' && m.cur >= 0 && tracks[m.cur]){
    loadAudio(m.cur, false);
    seekWhenReady(m.time);
    if(m.playing) aud.play().catch(() => stat('▶ 버튼을 눌러 이어서 재생하세요'));
  }
}

// 팝업 창: 원래 창으로 되돌리기(closing=true는 X로 창을 닫는 경우 → 원래 창은 일시정지 상태로 복귀)
async function returnToMain(closing){
  if(_returned) return;
  let op = null;
  try{ op = (window.opener && !window.opener.closed) ? window.opener : null; }catch(e){ op = null; }
  if(!op){
    if(closing) return;
    // 원래 창이 이미 닫혔으면 이 창을 일반 화면으로 전환
    isMini = false;
    document.documentElement.classList.remove('mini');
    history.replaceState(null, '', location.href.split('#')[0]);
    $('miniBtn').textContent = '⧉'; $('miniBtn').title = '미니 플레이어(팝업 창)로 열기';
    document.title = 'Music Player';
    stat('원래 창이 없어 이 창을 일반 화면으로 전환했습니다');
    return;
  }
  _returned = true;
  const state = { app:MSG, type:'return', cur, time: aud.currentTime || 0, playing: !aud.paused && !closing, vol: +$('vs').value };
  clearTimeout(_saveTimer);
  if(closing){ saveLibrary(); }
  else { aud.pause(); await saveLibrary(); }
  try{ op.postMessage(state, '*'); }catch(e){}
  if(!closing){ try{ op.focus(); }catch(e){} window.close(); }
}

window.addEventListener('message', e => {
  const m = e.data;
  if(!m || m.app !== MSG) return;
  if(!isMini){
    if(m.type === 'mini-ready' && miniActive && miniHandoff){
      const h = miniHandoff; miniHandoff = null;
      Promise.resolve(miniSavePromise).then(() => {
        try{ e.source.postMessage({ app:MSG, type:'handoff', ...h }, '*'); }catch(err){}
      });
    } else if(m.type === 'return'){
      exitMiniMode(m);
    }
  } else {
    if(m.type === 'handoff') startMini(m);
    else if(m.type === 'recall') returnToMain(false);
  }
});

// 팝업을 예외적으로 놓친 경우(강제 종료 등) 원래 창 자동 복귀
setInterval(() => {
  if(miniActive && (!miniWin || miniWin.closed)){
    setTimeout(() => { if(miniActive) exitMiniMode(null); }, 600);
  }
}, 1000);

if(isMini){
  document.documentElement.classList.add('mini');
  document.title = '♪ 미니 플레이어';
  $('miniBtn').textContent = '↩';
  $('miniBtn').title = '원래 창으로 되돌리기';
  let sent = false;
  try{ if(window.opener){ window.opener.postMessage({ app:MSG, type:'mini-ready' }, '*'); sent = true; } }catch(e){}
  _miniFallback = setTimeout(() => startMini(null), sent ? 1500 : 0);   // 넘겨받을 상태가 없으면 저장된 목록으로 시작
  window.addEventListener('pagehide', () => { if(isMini && !_returned) returnToMain(true); });
} else {
  restoreLibrary();
}
</script>
