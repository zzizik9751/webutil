<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Typing Practice</title>
<style>
:root{--bg:#f8f8f8;--fg:#222;--mut:#777;--line:#ddd;--card:#fff;--bad:#c0392b;--hm:34,34,34}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--card:#1e1e1e;--bad:#ff7b6b;--hm:238,238,238}}
:root.dark{--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--card:#1e1e1e;--bad:#ff7b6b;--hm:238,238,238}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mut{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mut)}
:root{--ff:Verdana,"Segoe UI","DejaVu Sans",Arial,sans-serif;--fs:22px}
#target{font-family:var(--ff);font-size:var(--fs);line-height:1.9;letter-spacing:.02em;white-space:pre-wrap;overflow-wrap:break-word;min-height:90px;user-select:none}
#target span{border-bottom:2px solid transparent}
#target .ok{color:var(--mut)}
#target .bad{color:var(--bad);border-bottom-color:var(--bad)}
#target .cur{border-bottom-color:var(--fg);font-weight:700}
#trans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:17px;color:var(--mut)}
textarea#inp{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--ff);font-size:calc(var(--fs) - 2px);line-height:1.6;letter-spacing:.02em;background:var(--card);color:var(--fg)}
textarea#inp:focus{outline:2px solid var(--fg);outline-offset:0}
textarea#inp:disabled{opacity:.5}
input.txt,textarea.txt{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:var(--card);color:var(--fg)}
textarea.txt{width:100%;min-height:80px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;width:0;background:var(--fg);transition:width .1s}
.big{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;margin-bottom:10px}
.big b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--mut)}
.kb{display:flex;flex-direction:column;gap:5px;align-items:center;margin:10px 0}
.kb .r{display:flex;gap:5px}
.k{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1.1;font-weight:600}
.k small{font-size:10px;font-weight:400;opacity:.75}
.hide{display:none!important}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h th,table.h td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
table.h th{color:var(--mut);font-weight:600;font-size:12px}
details summary{cursor:pointer;font-weight:600}
select.sel{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px;background:var(--card);color:var(--fg);max-width:220px}
.hint{color:var(--mut);font-size:12px;margin:6px 2px 0}
#imeWarn{color:var(--bad);font-size:14px;margin:6px 0}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}
footer a{color:inherit}
@media (max-width:560px){.k{width:30px;height:38px;font-size:13px}.big b{font-size:22px}.stats b{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>⌨️ English Typing Practice</h1>
  <div class="row"><a class="chip" id="langLink" href="typing.html">한글 버전</a><button class="chip" id="darkBtn" title="다크 모드">🌓</button></div>
</header>

<div class="card hide" id="serverBar">
  <div class="row">
    <b>이름</b>
    <input class="txt" id="nameInp" maxlength="20" placeholder="순위표에 표시될 이름" style="width:180px">
    <span class="mut" id="nameMsg"></span>
    <span style="flex:1"></span>
    <a class="chip" href="/rank" target="_blank">🏆 순위표</a>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:12px">
    <button class="chip on" data-mode="short">단문 (생활영어)</button>
    <button class="chip" data-mode="long">장문</button>
    <label class="mut" id="fixWrap" title="대문자/소문자만 틀린 글자를 자동으로 고쳐 정타로 처리합니다"><input type="checkbox" id="caseFix" checked> 대소문자 자동 교정</label>
    <label class="mut" id="transWrap"><input type="checkbox" id="showTrans" checked> 해석 보기</label>
    <span style="flex:1"></span>
    <button class="chip" id="nextBtn">다음 지문</button>
    <button class="chip" id="resetBtn">다시 (Esc)</button>
  </div>
  <div class="row mut" id="fontRow" style="margin-bottom:10px">
    <span id="fontLbl">글꼴</span><select class="sel" id="fontSel"><option value="verdana">Verdana</option><option value="segoe">Segoe UI</option><option value="georgia">Georgia</option><option value="consolas">Consolas</option></select>
    <span>글자 크기</span><button class="chip" id="fsMinus" title="작게">A-</button><button class="chip" id="fsPlus" title="크게">A+</button>
  </div>
  <div class="stats">
    <div><b id="sCpm">0</b><span>타수(CPM)</span></div>
    <div><b id="sWpm">0</b><span>WPM</span></div>
    <div><b id="sAcc">100%</b><span>정확도</span></div>
    <div><b id="sProg">0%</b><span>진행률</span></div>
    <div><b id="sTime">0.0</b><span>경과(초)</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>

<div class="card">
  <div id="pageInfo" class="mut hide" style="text-align:right;font-size:13px;margin-bottom:4px"></div>
  <div id="target"></div>
  <div id="trans" class="hide"></div>
  <div class="mut" id="srcInfo" style="margin-top:8px"></div>
  <div class="row mut hide" id="ttsBar" style="margin-top:8px">
    <button class="chip" id="ttsBtn">🔊 듣기</button><button class="chip" id="ttsStop">■ 정지</button>
    <span>속도</span><select class="sel" id="ttsRate"><option value="0.7">느리게</option><option value="0.85">조금 느리게</option><option value="1">보통</option><option value="1.15">빠르게</option></select>
    <span>음성</span><select class="sel" id="ttsVoice"></select>
    <label><input type="checkbox" id="ttsAuto"> 자동 읽기</label>
    <span id="ttsMsg"></span>
  </div>
</div>

<div id="imeWarn" class="hide">⚠ 한/영 키가 한글 입력 상태입니다. 영문으로 바꿔서 입력하세요.</div>
<textarea id="inp" lang="en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type here. The timer starts with your first key. (Enter: finish · Esc: restart)"></textarea>
<div class="hint" id="hint"></div>

<div class="card hide" id="result" style="margin-top:12px">
  <div class="big">
    <div><b id="rCpm">0</b><span>타수(CPM)</span></div>
    <div><b id="rWpm">0</b><span>WPM</span></div>
    <div><b id="rAcc">0%</b><span>정확도</span></div>
    <div><b id="rTime">0</b><span>시간(초)</span></div>
    <div><b id="rChars">0</b><span>글자수</span></div>
  </div>
  <div id="rSubmit" class="mut" style="margin-bottom:8px"></div>
  <div id="rFix" class="mut" style="margin-bottom:6px"></div>
  <div><b>약한 글자 Top3</b> <span id="rWeak" class="mut"></span></div>
  <div class="row" style="margin-top:10px">
    <b>오타 키 히트맵</b>
    <button class="chip on" data-hm="cur">이번</button>
    <button class="chip" data-hm="cum">누적</button>
  </div>
  <div class="kb" id="kb"></div>
  <div class="row">
    <button class="chip" id="copyBtn">결과 복사</button>
    <button class="chip" id="again">같은 지문 다시</button>
    <button class="chip" id="nextBtn2">다음 지문</button>
  </div>
</div>

<div class="card">
  <b>최근 기록 (10회)</b>
  <table class="h" id="hist" style="margin-top:6px"></table>
  <div class="row" style="margin-top:8px"><button class="chip" id="clearHist">기록·누적 통계 초기화</button></div>
</div>

<div class="card" id="customCard">
  <details id="custom">
    <summary>내 지문 입력</summary>
    <div style="margin-top:10px">
      <textarea class="txt" id="customTxt" placeholder="Paste your own English text and save."></textarea>
      <div class="row" style="margin-top:8px">
        <label><input type="checkbox" id="useCustom"> 내 지문 사용</label>
        <label><input type="checkbox" id="perLine"> 줄마다 한 지문 (줄 끝에 " | 해석" 가능)</label>
        <button class="chip" id="saveCustom">저장</button>
        <span class="mut" id="customMsg"></span>
      </div>
    </div>
  </details>
</div>

<footer>
  Created by <a href="https://blog.naver.com/zzizik" target="_blank" rel="noopener">zzizik</a>, with Claude AI.<br>

  <span id="ver"></span>
</footer>

<script>
const VERSION = 'v1.4 (2026-10-12)';

/*ENGINE-START*/
// 영문: 글자 1개 = 1타 (대문자 Shift는 별도로 세지 않음). 마지막 글자까지 즉시 채점.
function charStrokes() { return 1; }
function evaluate(target, typed) {
  const n = typed.length;
  let correct = 0, strokes = 0;
  const charMiss = {}, keyMiss = {};
  for (let i = 0; i < n; i++) {
    const t = target[i], c = typed[i];
    strokes += 1;
    if (t === c) { correct++; continue; }
    if (t === undefined) continue;
    charMiss[t] = (charMiss[t] || 0) + 1;
    const k = t.toLowerCase();
    if (/[a-z]/.test(k)) keyMiss[k] = (keyMiss[k] || 0) + 1;
  }
  return { n, correct, strokes, charMiss, keyMiss };
}
/*ENGINE-END*/

function combine(a, b) {                // 이전 페이지 결과 + 현재 페이지 결과
  const r = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    const x = a[k], y = b[k];
    if (typeof x === 'object' || typeof y === 'object') { r[k] = Object.assign({}, x); for (const j in (y || {})) r[k][j] = (r[k][j] || 0) + y[j]; }
    else r[k] = (x || 0) + (y || 0);
  }
  return r;
}
function paginate(text) {
  if (mode !== 'long' || text.length <= PAGE_MAX * 1.15) return [text];
  const n = Math.ceil(text.length / PAGE_MAX), per = text.length / n;
  const units = [];
  (text.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g) || [text]).forEach(s => {
    while (s.length > PAGE_MAX * 1.2) {     // 너무 긴 문장은 공백 기준으로 자름
      let cut = s.lastIndexOf(' ', PAGE_MAX); if (cut < PAGE_MAX * 0.5) cut = PAGE_MAX;
      units.push(s.slice(0, cut + 1)); s = s.slice(cut + 1);
    }
    units.push(s);
  });
  const out = []; let cur = '';
  for (const u of units) { cur += u; if (cur.length >= per - 30 && out.length < n - 1) { out.push(cur); cur = ''; } }
  if (cur) out.push(cur);
  out[out.length - 1] = out[out.length - 1].trimEnd();   // 쪽 끝의 공백은 다음 쪽으로 넘어가기 위해 직접 치도록 남김(마지막 쪽 제외)
  return out;
}

// ---- 지문 선택 ----
function parseLines(text) {
  return text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(s => {
    const i = s.indexOf(' | ');
    return i > 0 ? [norm(s.slice(0, i)), s.slice(i + 3).trim()] : [norm(s), ''];
  });
}
function chooseText() {
  const useC = !serverMode && $('#useCustom').checked && $('#customTxt').value.trim();
  let src = '', text = '', ko = '', key = '';
  if (mode === 'long') {
    if (serverTexts.long) { text = norm(serverTexts.long); src = '대회 지문 (서버)'; key = 'srv'; }
    else if (useC && !$('#perLine').checked) { text = norm($('#customTxt').value); src = '내 지문'; key = 'cus'; }
    else if (useC) { const L = parseLines($('#customTxt').value); const i = pickIdx(L.length, +lastKey.slice(1)); text = L[i][0]; ko = L[i][1]; src = '내 지문'; key = 'c' + i; }
    else { const i = pickIdx(BUILTIN_LONG.length, +lastKey.slice(1)); text = norm(BUILTIN_LONG[i].text); src = BUILTIN_LONG[i].title; key = 'b' + i; }
  } else {
    let pool, label;
    if (serverTexts.short) { pool = serverTexts.short; label = '대회 지문 (서버)'; }
    else if (useC) { pool = parseLines($('#customTxt').value); label = '내 지문'; }
    else { pool = BUILTIN_SHORT; label = '생활영어'; }
    const i = pickIdx(pool.length, +lastKey.slice(1));
    text = norm(pool[i][0]); ko = pool[i][1] || ''; src = label + ' #' + (i + 1); key = 'p' + i;
  }
  lastKey = key;
  srcBase = src + ' · ' + text.length + '자';
  trans = ko;
  return text;
}
function setTarget(text) {
  target = text;
  const el = $('#target'); el.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const ch of target) { const s = document.createElement('span'); s.textContent = ch; frag.appendChild(s); }
  el.appendChild(frag);
  const t = $('#trans');
  if (trans && mode === 'short' && $('#showTrans').checked) { t.textContent = '해석: ' + trans; t.classList.remove('hide'); }
  else t.classList.add('hide');
  pageLabel();
}
function reset(newText) {
  stopSpeak();
  clearInterval(timer); timer = null;
  started = finished = false;
  inp.value = ''; inp.readOnly = false;
  $('#imeWarn').classList.add('hide');
  $('#result').classList.add('hide');
  if (newText !== false) fullText = newText || chooseText();
  fixCount = 0; pages = paginate(fullText); pi = 0; accum = { n: 0, correct: 0, strokes: 0, charMiss: {}, keyMiss: {} };
  totalLen = Math.max(1, pages.join('').length);
  $('#srcInfo').textContent = srcBase + (pages.length > 1 ? ' · ' + pages.length + ' pages' : '');
  setTarget(pages[0]);
  inp.maxLength = target.length;
  render(evaluate(target, ''), 0);
  gate();
  if (!inp.disabled) inp.focus(); else if (serverMode) $('#nameInp').focus();
  if (newText !== false && ttsAutoOn()) setTimeout(speakCurrent, 150);
}
const DEFAULT_PH = inp.placeholder;
function gate() {
  if (serverMode) {
    const has = $('#nameInp').value.trim().length > 0;
    inp.disabled = !has;
    inp.placeholder = has ? DEFAULT_PH : '⬆ 먼저 위의 이름 칸에 이름을 입력하세요. (입력 후 Enter)';
    $('#nameInp').style.borderColor = has ? '' : 'var(--bad)';
    $('#nameMsg').textContent = has ? '' : '← 이름을 입력하면 타자 칸이 열립니다.';
    $('#nameMsg').style.color = has ? '' : 'var(--bad)';
  } else inp.disabled = false;
}

// ---- 화면 갱신 ----
function typedText() { return inp.value.replace(/[\r\n]/g, ''); }
function render(res, elapsed) {
  const spans = $('#target').children;
  const typed = typedText();
  for (let i = 0; i < spans.length; i++) {
    let c = '';
    if (i < res.n) c = (typed[i] === target[i]) ? 'ok' : 'bad';
    else if (i === res.n && !finished) c = 'cur';
    spans[i].className = c;
  }
  const nAll = accum.n + res.n, okAll = accum.correct + res.correct, stAll = accum.strokes + res.strokes;
  const accPct = nAll ? okAll / nAll * 100 : 100;
  const cpm = elapsed >= 1 ? stAll / (elapsed / 60) : 0;
  $('#sCpm').textContent = Math.round(cpm);
  $('#sWpm').textContent = Math.round(cpm / 5);
  $('#sAcc').textContent = Math.round(accPct) + '%';
  const prog = Math.min(100, nAll / totalLen * 100);
  $('#sProg').textContent = Math.round(prog) + '%';
  $('#sTime').textContent = elapsed.toFixed(1);
  $('#bar').style.width = prog + '%';
}
function update() {
  const res = evaluate(target, typedText());
  render(res, started ? (performance.now() - t0) / 1000 : 0);
  return res;
}

// ---- 입력 처리 ----
inp.addEventListener('compositionstart', () => { $('#imeWarn').classList.remove('hide'); });
function applyCaseFix() {                  // 대소문자만 다른 글자는 지문의 글자로 즉시 교체
  if (!caseFixOn()) return;
  const v = inp.value; let out = '', n = 0;
  for (let i = 0; i < v.length; i++) {
    const c = v[i], t = target[i];
    if (t !== undefined && c !== t && c.toLowerCase() === t.toLowerCase() && t.toLowerCase() !== t.toUpperCase()) { out += t; n++; }
    else out += c;
  }
  if (n) { const pos = inp.selectionStart; inp.value = out; try { inp.setSelectionRange(pos, pos); } catch (e) { } fixCount += n; }
}
inp.addEventListener('input', e => {
  if (finished) return;
  if (!e.isComposing) applyCaseFix();
  const typed = typedText();
  if (!started && typed.length > 0) { started = true; t0 = performance.now(); timer = setInterval(update, 200); }
  update();
  if (started && typed.length >= target.length) pageDone();
});
let finishedAt = 0;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); speakCurrent(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (started && !finished) finish(); else if (finished && Date.now() - finishedAt > 500) reset(); }
  else if (e.key === 'Escape') { e.preventDefault(); reset(false); }
  else if (e.key === 'Tab') { e.preventDefault(); if (!serverMode) reset(); }
});
['paste', 'drop', 'dragover', 'contextmenu', 'cut'].forEach(ev => inp.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement !== inp) reset(false);
  else if (e.key === 'Enter' && finished && document.activeElement === document.body && Date.now() - finishedAt > 500) reset();
});

// ---- 페이지 완료 / 전체 완료 ----
function pageDone() {
  if (pi >= pages.length - 1) { finish(); return; }
  accum = combine(accum, evaluate(target, typedText().slice(0, target.length)));
  pi++; inp.value = '';
  setTarget(pages[pi]); inp.maxLength = target.length;
  update(); inp.focus();
  if (ttsAutoOn()) setTimeout(speakCurrent, 150);
}
function finish() {
  if (finished || !started) return;
  const elapsed = (performance.now() - t0) / 1000;
  clearInterval(timer); timer = null;
  finished = true; finishedAt = Date.now(); inp.readOnly = true; stopSpeak();
  const typed = typedText();
  const pageRes = evaluate(target, typed);
  render(pageRes, elapsed);
  const res = combine(accum, pageRes);
  const cpm = elapsed > 0 ? res.strokes / (elapsed / 60) : 0;
  const acc = res.n ? res.correct / res.n * 100 : 0;
  const complete = pi >= pages.length - 1 && typed.length >= target.length;
  lastResult = { mode, cpm: Math.round(cpm * 10) / 10, wpm: Math.round(cpm / 5 * 10) / 10, acc: Math.round(acc * 10) / 10, secs: Math.round(elapsed * 10) / 10, chars: res.n, res, complete, fix: fixCount };
  const cum = LS.get('zz_typing_en_cum', { key: {}, ch: {} });
  for (const k in res.keyMiss) cum.key[k] = (cum.key[k] || 0) + res.keyMiss[k];
  for (const c in res.charMiss) cum.ch[c] = (cum.ch[c] || 0) + res.charMiss[c];
  LS.set('zz_typing_en_cum', cum);
  const hist = LS.get('zz_typing_en_hist', []);
  hist.unshift({ t: Date.now(), mode, cpm: Math.round(cpm), wpm: Math.round(cpm / 5), acc: Math.round(acc * 10) / 10, secs: Math.round(elapsed * 10) / 10, done: complete });
  LS.set('zz_typing_en_hist', hist.slice(0, 10));
  showResult(); renderHist(); submit();
}
const lab = c => c === ' ' ? '공백' : c;
function showResult() {
  const r = lastResult;
  $('#rCpm').textContent = Math.round(r.cpm);
  $('#rWpm').textContent = Math.round(r.wpm);
  $('#rAcc').textContent = r.acc + '%';
  $('#rTime').textContent = r.secs;
  $('#rChars').textContent = r.chars;
  const weak = Object.entries(r.res.charMiss).sort((a, b) => b[1] - a[1]).slice(0, 3);
  $('#rWeak').textContent = weak.length ? weak.map(([c, n]) => lab(c) + ' ' + n + '회').join('  ·  ') : '틀린 글자가 없습니다 👏';
  $('#rFix').textContent = caseFixOn() ? '대소문자 자동 교정 ' + r.fix + '회' + (r.fix ? ' (정타로 처리됨)' : '') : '';
  drawKb();
  $('#rSubmit').textContent = serverMode ? (r.complete ? '순위 등록 중…' : '끝까지 치지 않아 순위에는 등록되지 않았습니다.') : '';
  $('#result').classList.remove('hide');
}
async function submit() {
  if (!serverMode || !lastResult.complete) return;
  const name = $('#nameInp').value.trim();
  if (!name) return;
  try {
    const r = await fetch('/api/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, type: lastResult.mode + '_en', cpm: lastResult.cpm, acc: lastResult.acc, secs: lastResult.secs, chars: lastResult.chars })
    });
    const d = await r.json();
    $('#rSubmit').innerHTML = d.ok
      ? '✅ 등록 완료 · 영문 ' + (lastResult.mode === 'long' ? '장문' : '단문') + ' 기준 현재 <b>' + d.rank + '위</b> / ' + d.total + '명 · <a href="/rank" target="_blank">순위표 보기</a>'
      : '등록 실패: ' + (d.error || '');
  } catch (e) { $('#rSubmit').textContent = '서버에 연결할 수 없어 등록하지 못했습니다.'; }
}

// ---- 키보드 히트맵 (QWERTY) ----
const ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
function drawKb() {
  const data = hmView === 'cur' ? (lastResult ? lastResult.res.keyMiss : {}) : LS.get('zz_typing_en_cum', { key: {} }).key;
  const max = Math.max(1, ...Object.values(data));
  const kb = $('#kb'); kb.innerHTML = '';
  ROWS.forEach((row, ri) => {
    const r = document.createElement('div'); r.className = 'r'; r.style.marginLeft = (ri * 14) + 'px';
    for (const k of row) {
      const c = data[k] || 0, a = c ? 0.15 + 0.75 * c / max : 0;
      const d = document.createElement('div'); d.className = 'k';
      d.style.background = c ? 'rgba(var(--hm),' + a.toFixed(2) + ')' : 'transparent';
      d.style.color = a > 0.5 ? 'var(--bg)' : 'var(--fg)';
      d.innerHTML = k.toUpperCase() + '<small>' + (c || '') + '</small>';
      r.appendChild(d);
    }
    kb.appendChild(r);
  });
}
document.querySelectorAll('[data-hm]').forEach(b => b.onclick = () => {
  hmView = b.dataset.hm;
  document.querySelectorAll('[data-hm]').forEach(x => x.classList.toggle('on', x === b));
  drawKb();
});

// ---- 기록 ----
function renderHist() {
  const h = LS.get('zz_typing_en_hist', []);
  const t = $('#hist');
  if (!h.length) { t.innerHTML = '<tr><td class="mut">아직 기록이 없습니다.</td></tr>'; return; }
  t.innerHTML = '<tr><th>일시</th><th>구분</th><th>타수</th><th>WPM</th><th>정확도</th><th>시간</th></tr>' + h.map(x => {
    const d = new Date(x.t), p = n => String(n).padStart(2, '0');
    return '<tr><td>' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '</td><td>' + (x.mode === 'long' ? '장문' : '단문') + (x.done ? '' : ' (중단)') + '</td><td>' + x.cpm + '</td><td>' + (x.wpm || '') + '</td><td>' + x.acc + '%</td><td>' + x.secs + '초</td></tr>';
  }).join('');
}
$('#clearHist').onclick = () => {
  if (!confirm('최근 기록과 누적 통계를 모두 지울까요?')) return;
  LS.set('zz_typing_en_hist', []); LS.set('zz_typing_en_cum', { key: {}, ch: {} });
  renderHist(); if (lastResult) drawKb();
};
$('#copyBtn').onclick = async () => {
  if (!lastResult) return;
  const s = '[English Typing] ' + (lastResult.mode === 'long' ? 'Long' : 'Short') + ' · ' + Math.round(lastResult.cpm) + ' CPM · ' + Math.round(lastResult.wpm) + ' WPM · accuracy ' + lastResult.acc + '% · ' + lastResult.secs + 's';
  try { await navigator.clipboard.writeText(s); $('#copyBtn').textContent = '복사됨'; setTimeout(() => $('#copyBtn').textContent = '결과 복사', 1200); } catch (e) { prompt('복사하세요', s); }
};

// ---- 버튼/모드 ----
function setMode(m) {
  mode = m; LS.set('zz_typing_en_mode', m);
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  $('#transWrap').classList.toggle('hide', m !== 'short');
  lastKey = '';
  reset();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#nextBtn').onclick = $('#nextBtn2').onclick = () => reset();
$('#resetBtn').onclick = () => reset(false);
$('#again').onclick = () => reset(false);
$('#caseFix').addEventListener('change', () => { LS.set('zz_typing_en_casefix', $('#caseFix').checked); inp.focus(); });
$('#showTrans').addEventListener('change', () => { LS.set('zz_typing_en_trans', $('#showTrans').checked); setTarget(target); inp.focus(); });
$('#nameInp').addEventListener('input', () => { rawSet('zz_typing_name', $('#nameInp').value.trim()); gate(); });
$('#nameInp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.focus(); } });

// ---- 내 지문 (파일로 직접 열었을 때만) ----
function loadCustom() {
  const c = LS.get('zz_typing_en_custom', { text: '', use: false, line: false });
  $('#customTxt').value = c.text; $('#useCustom').checked = c.use; $('#perLine').checked = c.line;
  $('#showTrans').checked = LS.get('zz_typing_en_trans', true);
  $('#caseFix').checked = LS.get('zz_typing_en_casefix', true);
}
$('#saveCustom').onclick = () => {
  LS.set('zz_typing_en_custom', { text: $('#customTxt').value, use: $('#useCustom').checked, line: $('#perLine').checked });
  $('#customMsg').textContent = '저장했습니다.'; setTimeout(() => $('#customMsg').textContent = '', 1500);
  lastKey = ''; reset();
};

// ---- 글꼴 / 글자 크기 ----
const FONTS = {
  verdana: 'Verdana,"Segoe UI","DejaVu Sans",Arial,sans-serif',
  segoe: '"Segoe UI",Verdana,"Helvetica Neue",Arial,sans-serif',
  georgia: 'Georgia,"Times New Roman",serif',
  consolas: 'Consolas,"Cascadia Mono",Menlo,"Courier New",monospace'
};
let fontKey = LS.get('zz_typing_en_font', 'verdana'), fs = LS.get('zz_typing_en_fs', 22);
function applyFont() {
  const key = serverMode ? 'verdana' : (FONTS[fontKey] ? fontKey : 'verdana');   // 대회(서버) 접속 시 글꼴 고정
  const st = document.documentElement.style;
  st.setProperty('--ff', FONTS[key]); st.setProperty('--fs', fs + 'px');
  $('#fontSel').value = key;
}
$('#fontSel').onchange = () => { fontKey = $('#fontSel').value; LS.set('zz_typing_en_font', fontKey); applyFont(); inp.focus(); };
$('#fsMinus').onclick = () => { fs = Math.max(16, fs - 2); LS.set('zz_typing_en_fs', fs); applyFont(); inp.focus(); };
$('#fsPlus').onclick = () => { fs = Math.min(36, fs + 2); LS.set('zz_typing_en_fs', fs); applyFont(); inp.focus(); };

// ---- 지문 읽어 주기 (연습용, 영어 음성) ----
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let userActivated = false, voices = [];
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { userActivated = true; }, true));
function loadVoices() {
  if (!TTS) return;
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const sel = $('#ttsVoice'), saved = LS.get('zz_typing_en_voice', '');
  sel.innerHTML = '';
  voices.forEach(v => { const o = document.createElement('option'); o.value = v.voiceURI; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o); });
  if (saved && voices.some(v => v.voiceURI === saved)) sel.value = saved;
  else { const p = voices.find(v => /en-US/i.test(v.lang)); if (p) sel.value = p.voiceURI; }
  $('#ttsMsg').textContent = voices.length ? '' : '영어 음성이 없습니다.';
  $('#ttsBtn').disabled = !voices.length;
}
function stopSpeak() { if (TTS) { try { speechSynthesis.cancel(); } catch (e) { } } }
function speakCurrent() {
  if (!TTS || serverMode || !target || !voices.length) return;
  stopSpeak();
  const parts = target.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g) || [target];
  const v = voices.find(x => x.voiceURI === $('#ttsVoice').value);
  const rate = +$('#ttsRate').value || 1;
  parts.forEach(p => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = v ? v.lang : 'en-US'; if (v) u.voice = v; u.rate = rate;
    speechSynthesis.speak(u);
  });
}
function ttsAutoOn() { return TTS && !serverMode && userActivated && $('#ttsAuto').checked && voices.length > 0; }
$('#ttsBtn').onclick = () => { speakCurrent(); inp.focus(); };
$('#ttsStop').onclick = () => { stopSpeak(); inp.focus(); };
$('#ttsRate').onchange = () => { LS.set('zz_typing_en_rate', $('#ttsRate').value); inp.focus(); };
$('#ttsVoice').onchange = () => { LS.set('zz_typing_en_voice', $('#ttsVoice').value); inp.focus(); };
$('#ttsAuto').onchange = () => { LS.set('zz_typing_en_auto', $('#ttsAuto').checked); inp.focus(); };
function setHint() {
  let h = 'Enter: 완료 / 결과 화면에서 다음 지문 · Esc: 다시';
  if (!serverMode) h += ' · Tab: 건너뛰기';
  if (TTS && !serverMode && voices.length) h += ' · Ctrl+Enter: 듣기';
  $('#hint').textContent = h;
}

// ---- 시작 ----
async function detectServer() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 2000);
    const r = await fetch('/api/ping', { signal: ac.signal }); clearTimeout(to);
    if (!r.ok) return;
    const d = await r.json(); if (!d.ok) return;
    serverMode = true;
    try {
      const t = await (await fetch('/api/texts?lang=en')).json();
      serverTexts = { long: t.long || null, short: (t.short || null) && t.short.map(s => Array.isArray(s) ? s : [s, '']) };
    } catch (e) { }
    $('#serverBar').classList.remove('hide');
    $('#nameInp').value = rawGet('zz_typing_name') || '';
    $('#fixWrap').classList.add('hide');       // 대회 모드: 대소문자 교정 ON 고정(선택 불가)
    $('#customCard').classList.add('hide');   // 네트워크(대회) 버전: 내 지문 입력 차단
    $('#langLink').href = '/';
    $('#fontSel').classList.add('hide'); $('#fontLbl').classList.add('hide');   // 대회 모드: 글꼴 고정
  } catch (e) { }
}
(async function init() {
  loadCustom();
  await detectServer();
  applyFont();
  if (TTS && !serverMode) {
    $('#ttsRate').value = LS.get('zz_typing_en_rate', '1'); $('#ttsAuto').checked = LS.get('zz_typing_en_auto', false);
    loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); setHint(); };
    $('#ttsBar').classList.remove('hide');
  }
  setHint();
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === mode));
  $('#transWrap').classList.toggle('hide', mode !== 'short');
  renderHist();
  reset();
})();
</script>
</body>
</html>
