<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한글 타자 연습</title>
<style>
:root{--bg:#f8f8f8;--fg:#222;--mut:#777;--line:#ddd;--card:#fff;--bad:#c0392b;--hm:34,34,34}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--card:#1e1e1e;--bad:#ff7b6b;--hm:238,238,238}}
:root.dark{--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--card:#1e1e1e;--bad:#ff7b6b;--hm:238,238,238}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mut)}
#target{font-size:22px;line-height:1.9;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-height:90px;user-select:none}
#target span{border-bottom:2px solid transparent}
#target .ok{color:var(--mut)}
#target .bad{color:var(--bad);border-bottom-color:var(--bad)}
#target .cur{border-bottom-color:var(--fg);font-weight:700}
#target .comp{border-bottom-style:dotted}
textarea#inp{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:20px;background:var(--card);color:var(--fg)}
textarea#inp:focus{outline:2px solid var(--fg);outline-offset:0}
textarea#inp:disabled{opacity:.5}
input.txt,textarea.txt{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:var(--card);color:var(--fg)}
textarea.txt{width:100%;min-height:80px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;width:0;background:var(--fg);transition:width .1s}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:10px}
.big b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--mut)}
.kb{display:flex;flex-direction:column;gap:5px;align-items:center;margin:10px 0}
.kb .r{display:flex;gap:5px}
.k{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.1;position:relative}
.k small{font-size:9px;opacity:.7}
.hide{display:none!important}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h th,table.h td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
table.h th{color:var(--mut);font-weight:600;font-size:12px}
details summary{cursor:pointer;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}
footer a{color:inherit}
@media (max-width:560px){.k{width:30px;height:38px;font-size:13px}#target{font-size:19px}.big b{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>⌨️ 한글 타자 연습</h1>
  <div class="row"><a class="chip" id="langLink" href="typing_en.html">English</a><button class="chip" id="darkBtn" title="다크 모드">🌓</button></div>
</header>

<div class="card hide" id="serverBar">
  <div class="row">
    <b>이름</b>
    <input class="txt" id="nameInp" maxlength="20" placeholder="순위표에 표시될 이름" style="width:180px">
    <span class="mut" id="nameMsg"></span>
    <span style="flex:1"></span>
    <a class="chip" href="/rank" target="_blank">🏆 순위표</a>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:12px">
    <button class="chip on" data-mode="short">단문 연습</button>
    <button class="chip" data-mode="long">장문 연습</button>
    <span style="flex:1"></span>
    <button class="chip" id="nextBtn">다음 지문</button>
    <button class="chip" id="resetBtn">다시 (Esc)</button>
  </div>
  <div class="stats">
    <div><b id="sCpm">0</b><span>타수(CPM)</span></div>
    <div><b id="sAcc">100%</b><span>정확도</span></div>
    <div><b id="sProg">0%</b><span>진행률</span></div>
    <div><b id="sTime">0.0</b><span>경과(초)</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>

<div class="card">
  <div id="pageInfo" class="mut hide" style="text-align:right;font-size:13px;margin-bottom:4px"></div>
  <div id="target"></div>
  <div class="mut" id="srcInfo" style="margin-top:6px"></div>
</div>

<textarea id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력하세요. 첫 글자를 치면 시간이 시작됩니다. (Enter: 완료 · Esc: 다시)"></textarea>
<div class="mut" id="hint" style="margin:6px 2px 0;font-size:12px"></div>

<div class="card hide" id="result" style="margin-top:12px">
  <div class="big">
    <div><b id="rCpm">0</b><span>타수(CPM)</span></div>
    <div><b id="rAcc">0%</b><span>정확도</span></div>
    <div><b id="rTime">0</b><span>시간(초)</span></div>
    <div><b id="rChars">0</b><span>글자수</span></div>
  </div>
  <div id="rSubmit" class="mut" style="margin-bottom:8px"></div>
  <div><b>약한 자모 Top3</b> <span id="rWeak" class="mut"></span></div>
  <div class="row" style="margin-top:10px">
    <b>오타 키 히트맵</b>
    <button class="chip on" data-hm="cur">이번</button>
    <button class="chip" data-hm="cum">누적</button>
  </div>
  <div class="kb" id="kb"></div>
  <div class="row">
    <button class="chip" id="copyBtn">결과 복사</button>
    <button class="chip" id="again">같은 지문 다시</button>
    <button class="chip" id="nextBtn2">다음 지문</button>
  </div>
</div>

<div class="card">
  <b>최근 기록 (10회)</b>
  <table class="h" id="hist" style="margin-top:6px"></table>
  <div class="row" style="margin-top:8px"><button class="chip" id="clearHist">기록·누적 통계 초기화</button></div>
</div>

<div class="card" id="customCard">
  <details id="custom">
    <summary>내 지문 입력</summary>
    <div style="margin-top:10px">
      <textarea class="txt" id="customTxt" placeholder="연습할 글을 붙여넣고 저장하세요."></textarea>
      <div class="row" style="margin-top:8px">
        <label><input type="checkbox" id="useCustom"> 내 지문 사용</label>
        <label><input type="checkbox" id="perLine"> 줄마다 한 지문</label>
        <button class="chip" id="saveCustom">저장</button>
        <span class="mut" id="customMsg"></span>
      </div>
    </div>
  </details>
</div>

<footer>
  Created by <a href="https://blog.naver.com/zzizik" target="_blank" rel="noopener">zzizik</a>, with Claude AI.<br>
  Thanks to <a href="http://hwjy.co.kr/" target="_blank" rel="noopener">HWJY Co., Ltd.</a><br>
  <span id="ver"></span>
</footer>
</div>

<script>
/*ENGINE-START*/
// ---- 두벌식 자모 → 키 ----
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const KEY = {};
('ㄱr ㄲR ㄴs ㄷe ㄸE ㄹf ㅁa ㅂq ㅃQ ㅅt ㅆT ㅇd ㅈw ㅉW ㅊc ㅋz ㅌx ㅍv ㅎg ' +
 'ㅏk ㅐo ㅑi ㅒO ㅓj ㅔp ㅕu ㅖP ㅗh ㅘhk ㅙho ㅚhl ㅛy ㅜn ㅝnj ㅞnp ㅟnl ㅠb ㅡm ㅢml ㅣl ' +
 'ㄳrt ㄵsw ㄶsg ㄺfr ㄻfa ㄼfq ㄽft ㄾfx ㄿfv ㅀfg ㅄqt').split(' ').forEach(s => { KEY[s[0]] = s.slice(1); });

function decomp(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return [CHO[Math.floor(c / 588)], JUNG[Math.floor((c % 588) / 28)], JONG[c % 28]];
}
function keysOf(ch) {
  const d = decomp(ch);
  if (d) return d.map(j => (j ? KEY[j] : '')).join('');
  if (KEY[ch]) return KEY[ch];
  if (ch === '\n') return '';
  return ch;
}
function charStrokes(ch) { return Math.max(1, keysOf(ch).length); }

// 정답 target 과 입력 typed 비교. composing 이면 마지막 글자는 아직 채점하지 않음.
function evaluate(target, typed, composing) {
  let n = typed.length;
  if (composing && n > 0) n -= 1;
  let correct = 0, strokes = 0;
  const jamoMiss = {}, keyMiss = {};
  const addKeys = (ks) => { for (const k of ks) { const l = k.toLowerCase(); keyMiss[l] = (keyMiss[l] || 0) + 1; } };
  for (let i = 0; i < n; i++) {
    const t = target[i], c = typed[i];
    strokes += charStrokes(c);
    if (t === c) { correct++; continue; }
    if (t === undefined) continue;
    const dt = decomp(t), dc = decomp(c);
    if (dt) {
      for (let k = 0; k < 3; k++) {
        const j = dt[k];
        if (j && (!dc || dc[k] !== j)) { jamoMiss[j] = (jamoMiss[j] || 0) + 1; addKeys(KEY[j] || ''); }
      }
    } else if (t.trim()) { addKeys(keysOf(t)); }
  }
  return { n, correct, strokes, jamoMiss, keyMiss };
}
/*ENGINE-END*/

// ---- 내장 지문 (직접 작성한 글) ----
const BUILTIN_SHORT = [
  '전차선은 팬터그래프와 접촉하여 열차에 전력을 공급합니다.',
  '아침 햇살이 창문 너머로 천천히 번지고 있었습니다.',
  '작은 습관이 모이면 어느새 큰 변화를 만들어 냅니다.',
  '비가 그친 뒤의 공기는 유난히 맑고 차분했습니다.',
  '변전소는 받아 온 전력을 철도에 맞는 전압으로 바꿔 줍니다.',
  '꾸준히 연습하면 손가락이 먼저 알아서 움직입니다.',
  '오늘 할 일을 적어 두면 마음이 한결 가벼워집니다.',
  '좋은 설계는 눈에 띄지 않지만 오래도록 제 몫을 합니다.',
  '점심시간에는 동료들과 함께 근처 공원을 걸었습니다.',
  '빠르게 치는 것보다 정확하게 치는 것이 먼저입니다.',
  '열차가 지나간 자리에는 잠시 바람이 남아 있었습니다.',
  '낯선 길도 한 걸음씩 걷다 보면 어느새 익숙해집니다.',
  '값진 경험은 실패한 뒤에야 비로소 이해되기도 합니다.',
  '깊은 밤 도시의 불빛은 별처럼 반짝였습니다.',
  '넓은 들판에 꽃이 가득 피어 있고 닭 울음소리가 들렸습니다.',
  '맑은 물에 비친 앞산의 그림자가 흔들렸습니다.'
];
const BUILTIN_LONG = [
  '아침에 눈을 뜨면 가장 먼저 창문을 열어 공기를 바꿉니다. 차가운 바람이 방 안으로 들어오면 잠이 서서히 깨고, 하루가 시작되었다는 사실이 실감 납니다. 부엌에서는 물이 끓는 소리가 들리고, 향긋한 차 냄새가 천천히 퍼집니다. 서두르지 않고 한 모금씩 마시며 오늘 해야 할 일을 하나씩 떠올려 봅니다. 중요한 일부터 차근차근 처리하다 보면 어느새 오후가 되고, 피곤함보다 뿌듯함이 먼저 찾아옵니다. 하루를 마무리할 때는 잘한 일 한 가지를 떠올리며 불을 끕니다.',
  '전기철도는 전기로 움직이는 열차를 위해 전력을 공급하는 체계입니다. 발전소에서 만든 전기는 송전선로를 거쳐 변전소로 모이고, 변전소에서 철도에 알맞은 전압으로 바뀝니다. 이 전력은 선로 위에 설치된 전차선을 통해 열차의 팬터그래프로 전달됩니다. 열차가 안전하고 안정적으로 달리려면 전차선의 높이와 장력이 일정하게 유지되어야 하며, 설비를 점검하고 관리하는 일도 꾸준히 이어져야 합니다. 보이지 않는 곳에서 이루어지는 작은 노력이 매일 아침 열차가 제시간에 도착하는 힘이 됩니다.',
  '타자 연습은 속도와 정확도를 함께 키우는 훈련입니다. 처음에는 글자를 찾느라 손이 멈추지만, 반복할수록 손가락의 위치를 기억하게 되고 화면을 보지 않아도 자연스럽게 쓸 수 있게 됩니다. 중요한 것은 틀린 글자를 그냥 넘기지 않고 왜 틀렸는지 살펴보는 일입니다. 자주 틀리는 자음과 모음을 알면 연습할 곳이 분명해집니다. 하루에 십 분씩이라도 꾸준히 이어 가면 몇 주 뒤에는 눈에 띄게 달라진 자신을 만날 수 있습니다.'
];

// ---- 유틸/저장 ----
const VERSION = 'v1.4 (2026-10-12)';
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
function rawGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function rawSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
const norm = s => String(s).replace(/\s*[\r\n]+\s*/g, ' ').trim();
const pick = (arr, avoid) => { if (arr.length < 2) return arr[0]; let x; do { x = arr[Math.floor(Math.random() * arr.length)]; } while (x === avoid); return x; };

$('#ver').textContent = VERSION;

// ---- 다크 모드 (zz_dark 공용) ----
(function () {
  const root = document.documentElement;
  const v = rawGet('zz_dark');
  if (v === '1' || v === 'true' || v === 'dark') root.classList.add('dark');
  else if (v === '0' || v === 'false' || v === 'light') root.classList.add('light');
  $('#darkBtn').onclick = () => {
    const isDark = root.classList.contains('dark') || (!root.classList.contains('light') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.classList.remove('dark', 'light');
    root.classList.add(isDark ? 'light' : 'dark');
    rawSet('zz_dark', isDark ? '0' : '1');
  };
})();

// ---- 상태 ----
let mode = LS.get('zz_typing_mode', 'short');
let target = '', lastTarget = '';
let started = false, finished = false, composing = false, t0 = 0, timer = null;
// ---- 장문 페이지 나누기 ----
const PAGE_MAX = 350;          // 한 페이지 목표 글자 수 (문장 단위로 균등 분할)
let fullText = '', pages = [''], pi = 0, accum = {}, totalLen = 1, srcBase = '';
function combine(a, b) {                // 이전 페이지 결과 + 현재 페이지 결과
  const r = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    const x = a[k], y = b[k];
    if (typeof x === 'object' || typeof y === 'object') { r[k] = Object.assign({}, x); for (const j in (y || {})) r[k][j] = (r[k][j] || 0) + y[j]; }
    else r[k] = (x || 0) + (y || 0);
  }
  return r;
}
function paginate(text) {
  if (mode !== 'long' || text.length <= PAGE_MAX * 1.15) return [text];
  const n = Math.ceil(text.length / PAGE_MAX), per = text.length / n;
  const units = [];
  (text.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g) || [text]).forEach(s => {
    while (s.length > PAGE_MAX * 1.2) {     // 너무 긴 문장은 공백 기준으로 자름
      let cut = s.lastIndexOf(' ', PAGE_MAX); if (cut < PAGE_MAX * 0.5) cut = PAGE_MAX;
      units.push(s.slice(0, cut + 1)); s = s.slice(cut + 1);
    }
    units.push(s);
  });
  const out = []; let cur = '';
  for (const u of units) { cur += u; if (cur.length >= per - 30 && out.length < n - 1) { out.push(cur); cur = ''; } }
  if (cur) out.push(cur);
  out[out.length - 1] = out[out.length - 1].trimEnd();   // 쪽 끝의 공백은 다음 쪽으로 넘어가기 위해 직접 치도록 남김(마지막 쪽 제외)
  return out;
}
function pageLabel() {
  const pl = $('#pageInfo');
  if (pages.length > 1) { pl.textContent = '페이지 ' + (pi + 1) + '/' + pages.length; pl.classList.remove('hide'); } else pl.classList.add('hide');
}

let serverMode = false, serverTexts = { long: null, short: null };
let lastResult = null, hmView = 'cur';
const inp = $('#inp');

// ---- 지문 선택 ----
function chooseText() {
  const useC = !serverMode && $('#useCustom').checked && $('#customTxt').value.trim();
  const lines = useC ? $('#customTxt').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [];
  let src = '', text = '';
  if (mode === 'long') {
    if (serverTexts.long) { text = serverTexts.long; src = '대회 지문 (서버)'; }
    else if (useC) { text = $('#perLine').checked ? pick(lines, lastTarget) : norm($('#customTxt').value); src = '내 지문'; }
    else { text = pick(BUILTIN_LONG, lastTarget); src = '내장 지문'; }
  } else {
    if (serverTexts.short) { text = pick(serverTexts.short, lastTarget); src = '대회 지문 (서버)'; }
    else if (useC) { text = pick(lines, lastTarget); src = '내 지문'; }
    else { text = pick(BUILTIN_SHORT, lastTarget); src = '내장 지문'; }
  }
  srcBase = src + ' · ' + text.length + '자';
  return text;
}
function setTarget(text) {
  target = text;
  const el = $('#target'); el.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const ch of target) { const s = document.createElement('span'); s.textContent = ch; frag.appendChild(s); }
  el.appendChild(frag);
  pageLabel();
}
function reset(newText) {
  clearInterval(timer); timer = null;
  started = finished = composing = false;
  inp.value = ''; inp.readOnly = false;
  $('#result').classList.add('hide');
  if (newText !== false) { fullText = newText || chooseText(); lastTarget = fullText; }
  pages = paginate(fullText); pi = 0; accum = { n: 0, correct: 0, strokes: 0, jamoMiss: {}, keyMiss: {} };
  totalLen = Math.max(1, pages.join('').length);
  $('#srcInfo').textContent = srcBase + (pages.length > 1 ? ' · ' + pages.length + '페이지' : '');
  setTarget(pages[0]);
  inp.maxLength = target.length + 20;
  render(evaluate(target, '', false), 0);
  gate();
  if (!inp.disabled) inp.focus(); else if (serverMode) $('#nameInp').focus();
}
const DEFAULT_PH = inp.placeholder;
function gate() {
  if (serverMode) {
    const has = $('#nameInp').value.trim().length > 0;
    inp.disabled = !has;
    inp.placeholder = has ? DEFAULT_PH : '⬆ 먼저 위의 이름 칸에 이름을 입력하세요. (입력 후 Enter)';
    $('#nameInp').style.borderColor = has ? '' : 'var(--bad)';
    $('#nameMsg').textContent = has ? '' : '← 이름을 입력하면 타자 칸이 열립니다.';
    $('#nameMsg').style.color = has ? '' : 'var(--bad)';
  } else inp.disabled = false;
}

// ---- 화면 갱신 ----
function render(res, elapsed) {
  const spans = $('#target').children;
  const len = [...inp.value.replace(/[\r\n]/g, '')].length;
  for (let i = 0; i < spans.length; i++) {
    let c = '';
    if (i < res.n) c = (inp.value.replace(/[\r\n]/g, '')[i] === target[i]) ? 'ok' : 'bad';
    else if (i === res.n && !finished) c = 'cur' + (composing && len > res.n ? ' comp' : '');
    spans[i].className = c;
  }
  const nAll = accum.n + res.n, okAll = accum.correct + res.correct, stAll = accum.strokes + res.strokes;
  const accPct = nAll ? okAll / nAll * 100 : 100;
  const cpm = elapsed >= 1 ? stAll / (elapsed / 60) : 0;
  $('#sCpm').textContent = Math.round(cpm);
  $('#sAcc').textContent = Math.round(accPct) + '%';
  const prog = Math.min(100, nAll / totalLen * 100);
  $('#sProg').textContent = Math.round(prog) + '%';
  $('#sTime').textContent = elapsed.toFixed(1);
  $('#bar').style.width = prog + '%';
}
function typedText() { return inp.value.replace(/[\r\n]/g, ''); }
function update() {
  const res = evaluate(target, typedText(), composing && !finished);
  render(res, started ? (performance.now() - t0) / 1000 : 0);
  return res;
}

// ---- 입력 처리 ----
inp.addEventListener('compositionstart', () => { composing = true; });
inp.addEventListener('compositionend', () => { composing = false; onInput(); });
inp.addEventListener('input', onInput);
function onInput() {
  if (finished) return;
  const typed = typedText();
  if (!started && typed.length > 0) {
    started = true; t0 = performance.now();
    timer = setInterval(update, 200);
  }
  update();
  if (started && !composing && typed.length >= target.length) pageDone();
}
let finishedAt = 0;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (started && !finished) setTimeout(() => { composing = false; if (typedText().length >= target.length) pageDone(); else finish(); }, 40);
    else if (finished && Date.now() - finishedAt > 500) reset();
  }
  else if (e.key === 'Escape') { e.preventDefault(); reset(false); }
  else if (e.key === 'Tab') { e.preventDefault(); if (!serverMode) reset(); }
});
['paste', 'drop', 'dragover', 'contextmenu', 'cut'].forEach(ev => inp.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement !== inp) reset(false);
  else if (e.key === 'Enter' && finished && document.activeElement === document.body && Date.now() - finishedAt > 500) reset();
});

// ---- 페이지 완료 / 전체 완료 ----
function pageDone() {
  if (pi >= pages.length - 1) { finish(); return; }
  accum = combine(accum, evaluate(target, typedText().slice(0, target.length), false));
  pi++; inp.value = ''; composing = false;
  setTarget(pages[pi]); inp.maxLength = target.length + 20;
  update(); inp.focus();
}
function finish() {
  if (finished || !started) return;
  const elapsed = (performance.now() - t0) / 1000;
  clearInterval(timer); timer = null;
  finished = true; finishedAt = Date.now(); composing = false; inp.readOnly = true;
  const typed = typedText();
  const pageRes = evaluate(target, typed, false);
  render(pageRes, elapsed);
  const res = combine(accum, pageRes);
  const cpm = elapsed > 0 ? res.strokes / (elapsed / 60) : 0;
  const acc = res.n ? res.correct / res.n * 100 : 0;
  const complete = pi >= pages.length - 1 && typed.length >= target.length;
  lastResult = { mode, cpm: Math.round(cpm * 10) / 10, acc: Math.round(acc * 10) / 10, secs: Math.round(elapsed * 10) / 10, chars: res.n, res, complete };
  // 누적 통계/기록
  const cum = LS.get('zz_typing_cum', { key: {}, jamo: {} });
  for (const k in res.keyMiss) cum.key[k] = (cum.key[k] || 0) + res.keyMiss[k];
  for (const j in res.jamoMiss) cum.jamo[j] = (cum.jamo[j] || 0) + res.jamoMiss[j];
  LS.set('zz_typing_cum', cum);
  const hist = LS.get('zz_typing_hist', []);
  hist.unshift({ t: Date.now(), mode, cpm: Math.round(cpm), acc: Math.round(acc * 10) / 10, secs: Math.round(elapsed * 10) / 10, done: complete });
  LS.set('zz_typing_hist', hist.slice(0, 10));
  showResult();
  renderHist();
  submit();
}
function showResult() {
  const r = lastResult;
  $('#rCpm').textContent = Math.round(r.cpm);
  $('#rAcc').textContent = r.acc + '%';
  $('#rTime').textContent = r.secs;
  $('#rChars').textContent = r.chars;
  const weak = Object.entries(r.res.jamoMiss).sort((a, b) => b[1] - a[1]).slice(0, 3);
  $('#rWeak').textContent = weak.length ? weak.map(([j, c]) => j + ' ' + c + '회').join('  ·  ') : '틀린 자모가 없습니다 👏';
  drawKb();
  $('#rSubmit').textContent = serverMode ? (r.complete ? '순위 등록 중…' : '끝까지 치지 않아 순위에는 등록되지 않았습니다.') : '';
  $('#result').classList.remove('hide');
}
async function submit() {
  if (!serverMode || !lastResult.complete) return;
  const name = $('#nameInp').value.trim();
  if (!name) return;
  try {
    const r = await fetch('/api/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, type: lastResult.mode, cpm: lastResult.cpm, acc: lastResult.acc, secs: lastResult.secs, chars: lastResult.chars })
    });
    const d = await r.json();
    $('#rSubmit').innerHTML = d.ok
      ? '✅ 등록 완료 · ' + (lastResult.mode === 'long' ? '장문' : '단문') + ' 기준 현재 <b>' + d.rank + '위</b> / ' + d.total + '명 · <a href="/rank" target="_blank">순위표 보기</a>'
      : '등록 실패: ' + (d.error || '');
  } catch (e) { $('#rSubmit').textContent = '서버에 연결할 수 없어 등록하지 못했습니다.'; }
}

// ---- 키보드 히트맵 ----
const ROWS = [
  [['q', 'ㅂ'], ['w', 'ㅈ'], ['e', 'ㄷ'], ['r', 'ㄱ'], ['t', 'ㅅ'], ['y', 'ㅛ'], ['u', 'ㅕ'], ['i', 'ㅑ'], ['o', 'ㅐ'], ['p', 'ㅔ']],
  [['a', 'ㅁ'], ['s', 'ㄴ'], ['d', 'ㅇ'], ['f', 'ㄹ'], ['g', 'ㅎ'], ['h', 'ㅗ'], ['j', 'ㅓ'], ['k', 'ㅏ'], ['l', 'ㅣ']],
  [['z', 'ㅋ'], ['x', 'ㅌ'], ['c', 'ㅊ'], ['v', 'ㅍ'], ['b', 'ㅠ'], ['n', 'ㅜ'], ['m', 'ㅡ']]
];
function drawKb() {
  const data = hmView === 'cur' ? (lastResult ? lastResult.res.keyMiss : {}) : LS.get('zz_typing_cum', { key: {} }).key;
  const max = Math.max(1, ...Object.values(data));
  const kb = $('#kb'); kb.innerHTML = '';
  ROWS.forEach((row, ri) => {
    const r = document.createElement('div'); r.className = 'r'; r.style.marginLeft = (ri * 14) + 'px';
    row.forEach(([k, h]) => {
      const c = data[k] || 0, a = c ? 0.15 + 0.75 * c / max : 0;
      const d = document.createElement('div'); d.className = 'k';
      d.style.background = c ? 'rgba(var(--hm),' + a.toFixed(2) + ')' : 'transparent';
      d.style.color = a > 0.5 ? 'var(--bg)' : 'var(--fg)';
      d.innerHTML = h + '<small>' + k.toUpperCase() + (c ? ' ' + c : '') + '</small>';
      r.appendChild(d);
    });
    kb.appendChild(r);
  });
}
document.querySelectorAll('[data-hm]').forEach(b => b.onclick = () => {
  hmView = b.dataset.hm;
  document.querySelectorAll('[data-hm]').forEach(x => x.classList.toggle('on', x === b));
  drawKb();
});

// ---- 기록 ----
function renderHist() {
  const h = LS.get('zz_typing_hist', []);
  const t = $('#hist');
  if (!h.length) { t.innerHTML = '<tr><td class="mut">아직 기록이 없습니다.</td></tr>'; return; }
  t.innerHTML = '<tr><th>일시</th><th>구분</th><th>타수</th><th>정확도</th><th>시간</th></tr>' + h.map(x => {
    const d = new Date(x.t), p = n => String(n).padStart(2, '0');
    return '<tr><td>' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '</td><td>' + (x.mode === 'long' ? '장문' : '단문') + (x.done ? '' : ' (중단)') + '</td><td>' + x.cpm + '</td><td>' + x.acc + '%</td><td>' + x.secs + '초</td></tr>';
  }).join('');
}
$('#clearHist').onclick = () => {
  if (!confirm('최근 기록과 누적 통계를 모두 지울까요?')) return;
  LS.set('zz_typing_hist', []); LS.set('zz_typing_cum', { key: {}, jamo: {} });
  renderHist(); if (lastResult) drawKb();
};
$('#copyBtn').onclick = async () => {
  if (!lastResult) return;
  const s = '[한글 타자] ' + (lastResult.mode === 'long' ? '장문' : '단문') + ' · 타수 ' + Math.round(lastResult.cpm) + ' CPM · 정확도 ' + lastResult.acc + '% · ' + lastResult.secs + '초';
  try { await navigator.clipboard.writeText(s); $('#copyBtn').textContent = '복사됨'; setTimeout(() => $('#copyBtn').textContent = '결과 복사', 1200); } catch (e) { prompt('복사하세요', s); }
};

// ---- 버튼/모드 ----
function setMode(m) {
  mode = m; LS.set('zz_typing_mode', m);
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  reset();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#nextBtn').onclick = $('#nextBtn2').onclick = () => reset();
$('#resetBtn').onclick = () => reset(false);
$('#again').onclick = () => reset(false);
$('#nameInp').addEventListener('input', () => { rawSet('zz_typing_name', $('#nameInp').value.trim()); gate(); });
$('#nameInp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.focus(); } });

// ---- 내 지문 ----
function loadCustom() {
  const c = LS.get('zz_typing_custom', { text: '', use: false, line: false });
  $('#customTxt').value = c.text; $('#useCustom').checked = c.use; $('#perLine').checked = c.line;
}
$('#saveCustom').onclick = () => {
  LS.set('zz_typing_custom', { text: $('#customTxt').value, use: $('#useCustom').checked, line: $('#perLine').checked });
  $('#customMsg').textContent = '저장했습니다.'; setTimeout(() => $('#customMsg').textContent = '', 1500);
  reset();
};

// ---- 시작 ----
async function detectServer() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 2000);
    const r = await fetch('/api/ping', { signal: ac.signal }); clearTimeout(to);
    if (!r.ok) return;
    const d = await r.json(); if (!d.ok) return;
    serverMode = true;
    try { const t = await (await fetch('/api/texts')).json(); serverTexts = { long: t.long || null, short: t.short || null }; } catch (e) { }
    $('#serverBar').classList.remove('hide');
    $('#nameInp').value = rawGet('zz_typing_name') || '';
    $('#customCard').classList.add('hide');   // 네트워크(대회) 버전: 내 지문 입력 차단
    $('#langLink').href = '/en';
  } catch (e) { }
}
(async function init() {
  loadCustom();
  await detectServer();
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === mode));
  renderHist();
  $('#hint').textContent = 'Enter: 완료 / 결과 화면에서 다음 지문 · Esc: 다시' + (serverMode ? '' : ' · Tab: 건너뛰기');
  reset();
})();
</script>
